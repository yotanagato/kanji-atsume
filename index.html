<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>まなびあつめ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #ffeede 0%, #fff6e0 45%, #e4f5e6 100%);
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; }

  .screen {
    display: none;
    width: 100%; height: 100%;
    max-width: 820px;
    margin: 0 auto;
    flex-direction: column;
    align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  h1 {
    font-size: clamp(26px, 7vw, 40px);
    color: #d2603a;
    text-shadow: 2px 2px 0 #fff;
    margin: 14px 0 2px;
    text-align: center;
  }
  .subtitle { color: #a0704a; font-size: 16px; margin-bottom: 10px; text-align: center; }

  /* ===== ボタン ===== */
  .big-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%;
    min-height: 74px;
    margin: 7px 0;
    border: none;
    border-radius: 24px;
    font-family: inherit;
    font-size: clamp(20px, 5.5vw, 28px);
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
  .big-btn .emoji { font-size: 1.3em; }
  .big-btn:disabled { opacity: 0.45; cursor: default; }
  .btn-start  { background: linear-gradient(180deg, #ffb84d, #ff9b26); }
  .btn-review { background: linear-gradient(180deg, #7fc4f5, #4a9ad8); }
  .btn-zukan  { background: linear-gradient(180deg, #6ecb8b, #43a865); }
  .btn-record { background: linear-gradient(180deg, #b39ddb, #9575cd); }
  .btn-gate   { background: linear-gradient(180deg, #b0bec5, #90a4ae); }

  .top-bar {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    padding: 4px 0 6px;
    min-height: 52px;
  }
  .back-btn {
    border: none; background: #fff; color: #d2603a;
    font-family: inherit; font-size: 17px; font-weight: bold;
    padding: 10px 18px; border-radius: 20px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12); cursor: pointer;
    flex-shrink: 0; white-space: nowrap;
  }
  .back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  .screen-title { font-size: 21px; font-weight: bold; color: #d2603a; text-align: center; }
  .star-count {
    background: #fff; border-radius: 20px; padding: 8px 14px;
    font-size: 18px; font-weight: bold; color: #e8a000;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    flex-shrink: 0; white-space: nowrap;
  }
  @media (max-width: 480px) {
    .back-btn { font-size: 15px; padding: 8px 12px; }
    .screen-title { font-size: 17px; }
    .star-count { font-size: 15px; padding: 6px 10px; }
  }

  /* ===== チップ ===== */
  .chip-row { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; margin: 3px 0 6px; }
  .chip {
    border: 3px solid #ffb84d; background: #fff; color: #c96a1e;
    font-family: inherit; font-size: 15px; font-weight: bold;
    padding: 8px 13px; border-radius: 18px; cursor: pointer;
    min-height: 42px;
  }
  .chip.on { background: #ffb84d; color: #fff; }
  .chip.q { border-color: #6ecb8b; color: #2e8a52; }
  .chip.q.on { background: #6ecb8b; color: #fff; }
  .pick-label { font-size: 15px; font-weight: bold; color: #a0704a; margin-top: 8px; }
  .pool-info { font-size: 15px; color: #a0704a; margin: 2px 0 6px; min-height: 20px; text-align: center; }

  /* ===== 問題カード ===== */
  .q-card {
    width: 100%;
    background: #fff;
    border-radius: 30px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    padding: clamp(12px, 3vw, 24px) clamp(10px, 3vw, 26px);
    margin: 4px 0 8px;
    min-height: clamp(120px, 20vh, 180px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
  }
  .q-label { font-size: clamp(15px, 4vw, 19px); color: #a0704a; font-weight: bold; }
  .q-emoji { font-size: clamp(34px, 9vw, 54px); line-height: 1.1; }
  .q-kanji {
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(72px, 22vw, 132px); line-height: 1.05; color: #3a3226; font-weight: bold;
  }
  .q-yomi { font-size: clamp(38px, 11vw, 64px); font-weight: bold; color: #d2603a; letter-spacing: 0.06em; }
  .q-word {
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(44px, 13vw, 76px); font-weight: bold; color: #3a3226; letter-spacing: 0.04em;
  }
  .q-word .blank { color: #d2603a; background: #ffeede; border-radius: 10px; padding: 0 0.12em; }
  .q-wordyomi { font-size: clamp(18px, 5vw, 26px); color: #a0704a; font-weight: bold; letter-spacing: 0.06em; }
  .speak-btn {
    border: none; background: #ffe2c0; color: #d2603a;
    font-family: inherit; font-size: 17px; font-weight: bold;
    padding: 10px 20px; border-radius: 22px; cursor: pointer; min-height: 46px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.10);
  }
  .speak-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.10); }

  /* ===== 選択肢 ===== */
  .choices { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .choice {
    border: none; background: #fff; cursor: pointer;
    border-radius: 24px; box-shadow: 0 5px 0 rgba(0,0,0,0.14);
    min-height: clamp(96px, 21vh, 168px);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; color: #3a3226;
    transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
  }
  .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.14); }
  .choice .kanji {
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(46px, 13vw, 78px); font-weight: bold; line-height: 1;
  }
  .choice .yomi { font-size: clamp(26px, 7.5vw, 40px); font-weight: bold; letter-spacing: 0.04em; }
  .choice.ok  { background: #c8f0cf; box-shadow: 0 5px 0 #7bc48c; animation: pop 0.32s ease; }
  .choice.ng  { background: #ffe0e0; box-shadow: 0 5px 0 #f0a8a8; }
  .choice.dim { opacity: 0.45; }
  @keyframes pop { 0%{transform:scale(1);} 45%{transform:scale(1.12);} 100%{transform:scale(1);} }

  .feedback { min-height: 42px; font-size: clamp(20px, 5.5vw, 28px); font-weight: bold; text-align: center; color: #43a865; }
  .feedback.again { color: #4a9ad8; }

  .progress { display: flex; gap: 6px; justify-content: center; margin: 2px 0 6px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px #e6c9a8; }
  .dot.done { background: #ffb84d; box-shadow: none; }
  .dot.now  { background: #d2603a; box-shadow: 0 0 0 3px #ffd9c0; }

  .q-num {
    font-size: clamp(46px, 13vw, 74px); font-weight: bold; color: #3a3226; letter-spacing: 0.04em;
  }
  .q-bar .q-num { font-size: clamp(34px, 10vw, 52px); }
  .choice .num { font-size: clamp(40px, 12vw, 64px); font-weight: bold; }
  .q-en {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(40px, 12vw, 66px); font-weight: bold; color: #3a3226; letter-spacing: 0.01em;
  }
  .q-bar .q-en { font-size: clamp(30px, 9vw, 48px); }
  .choice .en {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(24px, 7vw, 40px); font-weight: bold;
  }

  /* ===== えいご一覧 ===== */
  #eigo-list { width: 100%; padding-bottom: 12px; }
  .erow {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: none; width: 100%;
    border-radius: 16px; box-shadow: 0 3px 0 rgba(0,0,0,0.10);
    padding: 8px 12px; margin-bottom: 7px; cursor: pointer; font-family: inherit;
  }
  .erow.b2 { background: #ddf0ff; box-shadow: 0 3px 0 #a8cfe8; }
  .erow.b3 { background: linear-gradient(180deg, #fff2c4, #ffdf8a); box-shadow: 0 3px 0 #e0b84d; }
  .erow.new { background: #f6efe4; }
  .erow .ee { font-size: 26px; width: 32px; text-align: center; }
  .erow .en {
    font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif;
    font-size: 20px; font-weight: bold; color: #3a3226; width: 84px; text-align: left;
  }
  .erow .ja { flex: 1; font-size: 16px; color: #6b5a46; text-align: left; }
  .erow .mk2 { font-size: 15px; white-space: nowrap; }

  /* ===== くく表 ===== */
  #kuku-table { width: 100%; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; padding-bottom: 12px; }
  .kcell {
    aspect-ratio: 1 / 1; border: none; border-radius: 8px; cursor: pointer;
    background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.10);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: clamp(11px, 3vw, 16px); font-weight: bold; color: #3a3226;
  }
  .kcell.head { background: #ffe2c0; color: #c96a1e; box-shadow: none; cursor: default; }
  .kcell.corner { background: transparent; box-shadow: none; cursor: default; }
  .kcell.new { background: #f6efe4; color: #c8bba8; }
  .kcell.b2  { background: #ddf0ff; box-shadow: 0 2px 0 #a8cfe8; }
  .kcell.b3  { background: linear-gradient(180deg, #fff2c4, #ffdf8a); box-shadow: 0 2px 0 #e0b84d; }

  .progress-num { font-size: 16px; font-weight: bold; color: #a0704a; padding: 2px 0; }

  .mtypes { margin: 10px 0 2px; border-top: 1px dashed #f0e0cc; }
  .mtype-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; color: #6b5a46; padding: 6px 4px; border-bottom: 1px dashed #f0e0cc;
  }
  .mtype-row span:last-child { font-size: 17px; }

  /* ===== けっか ===== */
  .result-big { font-size: clamp(30px, 8vw, 46px); font-weight: bold; color: #d2603a; margin: 10px 0 4px; text-align: center; }
  .result-stars { font-size: clamp(30px, 8vw, 44px); margin: 6px 0; text-align: center; word-break: break-all; }
  .result-list { width: 100%; background: #fff; border-radius: 22px; padding: 12px; margin: 8px 0; box-shadow: 0 4px 0 rgba(0,0,0,0.10); }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px dashed #f0e0cc; }
  .result-row:last-child { border-bottom: none; }
  .result-row .k { font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif; font-size: 32px; font-weight: bold; width: 46px; text-align: center; }
  .result-row .t { flex: 1; font-size: 16px; color: #6b5a46; }
  .result-row .m { font-size: 22px; }
  .stamp-pop { font-size: clamp(46px, 13vw, 70px); text-align: center; margin: 6px 0; }

  /* ===== ずかん ===== */
  .zukan-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; padding-bottom: 12px; }
  .zcell {
    aspect-ratio: 1 / 1; border: none; cursor: pointer;
    border-radius: 16px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    display: flex; align-items: center; justify-content: center;
    font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif;
    font-size: clamp(26px, 6.5vw, 36px); font-weight: bold; color: #3a3226;
    position: relative;
  }
  .zcell:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  .zcell.new { color: #c8bba8; background: #f6efe4; }
  .zcell.b2 { background: #ddf0ff; box-shadow: 0 3px 0 #a8cfe8; }
  .zcell.b3 { background: linear-gradient(180deg, #fff2c4, #ffdf8a); box-shadow: 0 3px 0 #e0b84d; }
  .zcell .mark { position: absolute; top: 1px; right: 4px; font-size: 12px; }
  .zukan-legend { font-size: 14px; color: #a0704a; text-align: center; margin: 2px 0 8px; }

  /* ===== モーダル ===== */
  .modal-back {
    position: fixed; inset: 0; background: rgba(60,40,20,0.45);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .modal-back.on { display: flex; }
  .modal {
    background: #fff; border-radius: 28px; padding: 20px; width: 100%; max-width: 400px;
    text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,0.18); max-height: 86vh; overflow-y: auto;
  }
  .modal .mk { font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif; font-size: clamp(76px, 22vw, 112px); font-weight: bold; line-height: 1.1; }
  .modal .my { font-size: 22px; font-weight: bold; color: #d2603a; margin: 4px 0; letter-spacing: 0.05em; }
  .modal .mw { font-size: 19px; color: #6b5a46; margin: 3px 0; }
  .modal .mw b { font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif; font-size: 24px; }
  .modal .mbox { font-size: 15px; color: #a0704a; margin-top: 8px; }

  /* ===== きろく ===== */
  .card { width: 100%; background: #fff; border-radius: 22px; padding: 14px; margin: 7px 0; box-shadow: 0 4px 0 rgba(0,0,0,0.10); }
  .card h3 { font-size: 17px; color: #d2603a; margin-bottom: 8px; }
  .stat-row { display: flex; justify-content: space-around; text-align: center; }
  .stat-row .n { font-size: 28px; font-weight: bold; color: #d2603a; }
  .stat-row .l { font-size: 13px; color: #a0704a; }
  .stamp-grid { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .stamp-grid span { font-size: 30px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 14px; color: #6b5a46; }
  .bar-row .d { width: 52px; flex-shrink: 0; }
  .bar { flex: 1; height: 16px; background: #f2e6d6; border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#ffb84d,#ff9b26); }
  .bar-row .v { width: 62px; text-align: right; flex-shrink: 0; }

  /* ===== せってい ===== */
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px dashed #f0e0cc; font-size: 16px; color: #6b5a46; }
  .set-row:last-child { border-bottom: none; }
  select, input[type=range] { font-family: inherit; font-size: 16px; }
  select { padding: 8px; border-radius: 12px; border: 2px solid #ffb84d; background: #fff; max-width: 60%; }
  .danger { background: linear-gradient(180deg,#ef9a9a,#e57373); }
  .gate-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; margin: 10px auto; }
  .gate-pad button { min-height: 62px; border: none; border-radius: 18px; background: #fff; font-family: inherit; font-size: 26px; font-weight: bold; color: #6b5a46; box-shadow: 0 4px 0 rgba(0,0,0,0.12); cursor: pointer; }
  .gate-input {
    text-align: center; font-size: 34px; font-weight: bold; color: #6b5a46;
    background: #fff; border-radius: 16px; padding: 8px 0; margin: 4px auto 0;
    width: 100%; max-width: 300px; letter-spacing: 0.1em; min-height: 54px;
  }
  .gate-msg { text-align: center; color: #a0704a; font-size: 15px; margin-top: 8px; min-height: 22px; }

  /* ===== さかなつりモード ===== */
  [hidden] { display: none !important; }
  #fish-area { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #fish-canvas {
    width: 100%; flex: 1; min-height: 240px; display: block;
    border-radius: 22px; background: #1565a0;
    box-shadow: 0 5px 0 rgba(0,0,0,0.14);
    touch-action: manipulation; cursor: pointer;
  }
  .q-bar {
    width: 100%; background: #fff; border-radius: 22px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    padding: 8px 14px 10px; margin-bottom: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .q-bar .q-label  { font-size: 14px; }
  .q-bar .q-emoji  { font-size: clamp(24px, 6vw, 34px); }
  .q-bar .q-kanji  { font-size: clamp(40px, 11vw, 62px); }
  .q-bar .q-yomi   { font-size: clamp(30px, 8vw, 44px); }
  .q-bar .q-word   { font-size: clamp(28px, 8vw, 46px); }
  .q-bar .q-wordyomi { font-size: clamp(15px, 4vw, 20px); }
  .q-bar .speak-btn { padding: 6px 16px; min-height: 38px; font-size: 15px; margin-top: 4px; }
  .choice:disabled { cursor: default; }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .spacer { flex: 1; min-height: 4px; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="app">

  <!-- ============ ホーム ============ -->
  <div class="screen active" id="screen-home">
    <h1>まなびあつめ</h1>
    <div class="subtitle">かんじ80もじ ・ えいご52ご ・ くく81</div>

    <div class="pool-info" id="pool-info"></div>

    <button class="big-btn btn-start" id="btn-start"><span class="emoji">🎴</span>はじめる</button>
    <button class="big-btn btn-review" id="btn-review"><span class="emoji">🔁</span>にがてを れんしゅう</button>
    <button class="big-btn btn-zukan" data-go="zukan"><span class="emoji">📖</span>ずかん</button>
    <div class="spacer"></div>
    <button class="big-btn btn-record" data-go="record"><span class="emoji">⭐</span>きろく<span class="star-num">0</span></button>
    <button class="big-btn btn-gate" data-go="gate"><span class="emoji">🔒</span>おとなのひと</button>
  </div>

  <!-- ============ もんだい ============ -->
  <div class="screen" id="screen-play">
    <div class="top-bar">
      <button class="back-btn" id="btn-quit">やめる</button>
      <div class="screen-title" id="play-title">もんだい</div>
      <div class="star-count">⭐<span class="star-num">0</span></div>
    </div>
    <div class="progress" id="progress"></div>

    <div id="card-area" style="width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="q-card" id="q-card"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <div class="spacer"></div>
    </div>

    <div id="fish-area" hidden>
      <div class="q-bar" id="q-bar"></div>
      <canvas id="fish-canvas"></canvas>
    </div>
  </div>

  <!-- ============ けっか ============ -->
  <div class="screen" id="screen-result">
    <div class="result-big" id="result-big"></div>
    <div class="result-stars" id="result-stars"></div>
    <div class="stamp-pop" id="stamp-pop"></div>
    <div class="result-list" id="result-list"></div>
    <button class="big-btn btn-start" id="btn-again"><span class="emoji">🎴</span>もういちど</button>
    <button class="big-btn btn-zukan" data-go="zukan"><span class="emoji">📖</span>ずかんを みる</button>
    <button class="big-btn btn-record" data-go="home"><span class="emoji">🏠</span>おうちへ</button>
  </div>

  <!-- ============ ずかん ============ -->
  <div class="screen" id="screen-zukan">
    <div class="top-bar">
      <button class="back-btn" data-go="home">もどる</button>
      <div class="screen-title">ずかん</div>
      <div class="star-count">⭐<span class="star-num">0</span></div>
    </div>
    <div class="chip-row" id="zukan-tabs"></div>
    <div class="zukan-legend" id="zukan-legend"></div>
    <div class="zukan-grid" id="zukan-grid"></div>
    <div id="kuku-table" hidden></div>
    <div id="eigo-list" hidden></div>
  </div>

  <!-- ============ きろく ============ -->
  <div class="screen" id="screen-record">
    <div class="top-bar">

  { id: "kanji", label: "✏️ かんじ" },
  { id: "eigo",  label: "🔤 えいご" },
  { id: "kuku",  label: "✖️ くく" }

const QTYPES = [
  { id: "y2k",  subject: "kanji", label: "よみ→かんじ" },
  { id: "k2y",  subject: "kanji", label: "かんじ→よみ" },
  { id: "word", subject: "kanji", label: "ことば" },
  { id: "mul",   subject: "kuku", label: "かけざん" },

// 数字のひらがな読み（読み上げ用）
const NUM_YOMI = ["ゼロ","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
function numYomi(n) {
  if (n < 10) return NUM_YOMI[n];
  if (n < 20) return "じゅう" + (n % 10 ? NUM_YOMI[n % 10] : "");
  const t = Math.floor(n / 10);
  return NUM_YOMI[t] + "じゅう" + (n % 10 ? NUM_YOMI[n % 10] : "");
}
function qtypesOf(subject) { return QTYPES.filter(t => t.subject === subject); }
function qtypeLabel(id) { const t = QTYPES.find(x => x.id === id); return t ? t.label : id; }

/* アプリの版。version.json と必ず同じ値にすること（bump-version.py で両方を書き換える） */
const APP_VERSION = "2026-09-12-8";

const SET_SIZES = [5, 10, 15, 20, 30, 50, 100];
const STARS_PER_STAMP = 10;
const STAMP_POOL = ["🐶","🐱","🐰","🦊","🐻","🐼","🐯","🦁","🐸","🐵","🐷","🐥","🦄","🐙","🐬","🦋","🚀","⚽","🍩","🍓","🍕","🎈","🎸","🏆"];

/* ================================================================
   マス（item）＝ おぼえた/おぼえていない を管理する最小単位
   漢字は「1字 × 出題タイプ3つ」で3マス。80字なので240マスになる。
   id がそのまま保存キー。 例) "kanji:山:y2k"
================================================================ */
function buildAllItems() {
  const out = [];
  KANJI.forEach(k => {
    qtypesOf("kanji").forEach(t => {
      out.push({ id: "kanji:" + k.k + ":" + t.id, subject: "kanji", qtype: t.id, k: k });
    });
  });
  EIGO.forEach(w => {
    qtypesOf("eigo").forEach(t => {
      out.push({ id: "eigo:" + w.en + ":" + t.id, subject: "eigo", qtype: t.id, w: w });
    });
  });
  for (let a = 1; a <= 9; a++) {
    for (let b = 1; b <= 9; b++) {
      out.push({ id: "kuku:" + a + "x" + b + ":mul", subject: "kuku", qtype: "mul", a: a, b: b });
    }
  }
  return out;
}
const ITEMS = buildAllItems();

// 同じ見出し（同じ漢字）を1セットに何度も出さないためのキー
function refKey(item) { return item.subject + ":" + (item.k ? item.k.k : item.w ? item.w.en : item.id); }
function itemsFor(subject, refName) {
  return ITEMS.filter(i => i.subject === subject && refKey(i) === subject + ":" + refName);
}

   保存データ
   kanji-data … 成績・設定（1キーのみ。壊れても他に波及しない）
================================================================ */
const DATA_VERSION = 2;   // 1→2 で「漢字ごと」から「マスごと」に変えた

const DEFAULT_DATA = {
  ver: DATA_VERSION,
  stars: 0,
  stamps: [],
  box: {},          // マスid -> 1..3（ライトナー箱）
  stat: {},         // マスid -> { ok, ng }
  days: {},         // "YYYY-MM-DD" -> { total, ok }
  settings: {
    speak: true, rate: 0.9, voiceURI: "", mode: "fish",
    subjects: ["kanji"], qtypes: ["y2k","k2y","word","mul"],
    lv: 0, grp: "", dan: 0, setSize: 5
  }
};

const store = {
  data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem("kanji-data")); } catch (e) { d = null; }
    this.data = Object.assign({}, DEFAULT_DATA, d || {});
    this.data.settings = Object.assign({}, DEFAULT_DATA.settings, (d && d.settings) || {});
    if (!Array.isArray(this.data.settings.qtypes) || this.data.settings.qtypes.length === 0) {
      this.data.settings.qtypes = ["y2k","k2y","word"];
    }
    if (!Array.isArray(this.data.settings.subjects) || this.data.settings.subjects.length === 0) {
      this.data.settings.subjects = ["kanji"];
    }
    // 箱の持ち方（キーの形）が変わったので、古い記録は作り直す。
    // 星・スタンプ・日別記録は残す
    if (this.data.ver !== DATA_VERSION) {
      this.data.box = {};
      this.data.stat = {};
      this.data.ver = DATA_VERSION;
      this.save();
    }
  },
  save() { try { localStorage.setItem("kanji-data", JSON.stringify(this.data)); } catch (e) {} },
  todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  },
  addRecord(ok) {
    const k = this.todayKey();
    const day = this.data.days[k] || { total: 0, ok: 0 };
    day.total++;
    if (ok) day.ok++;
    this.data.days[k] = day;
  }
};
store.load();

function findKanji(k) { return KANJI.find(x => x.k === k); }
function getBox(id) { return store.data.box[id] || 1; }
function statOf(id) { return store.data.stat[id] || { ok: 0, ng: 0 }; }

function maybeAwardStamp() {
  const earned = Math.floor(store.data.stars / STARS_PER_STAMP);
  if (earned > store.data.stamps.length) {
    const remain = STAMP_POOL.filter(s => !store.data.stamps.includes(s));
    if (remain.length === 0) return null;
    const pick = remain[Math.floor(Math.random() * remain.length)];
    store.data.stamps.push(pick);
    store.save();
    return pick;
  }
  return null;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ================================================================
   効果音（WebAudio・外部ファイルなし）
================================================================ */
const sound = {
  ctx: null,
  unlocked: false,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  // iOS Safari 対策。
  //  ・AudioContext は必ず「指で触った瞬間」に作って resume しないと、以後ずっと無音になる
  //  ・audioSession.type = "playback" を指定しないと、着信スイッチ（マナーモード）で
  //    WebAudio だけ消される（読み上げは鳴るのに効果音が鳴らない、という状態になる）
  unlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    const ctx = this.ensure();
    if (!ctx) return;
    if (this.unlocked) return;
    this.unlocked = true;
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) {}
  },
  tone(freq, start, dur, type, vol) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol || 0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },
  tap()     { if (this.ensure()) this.tone(660, 0, 0.08, "sine", 0.12); },
  correct() { if (this.ensure()) { this.tone(880, 0, 0.15); this.tone(1320, 0.15, 0.3); } },
  // まちがい用。叱る音にしない（やわらかい上向きの2音）
  again()   { if (this.ensure()) { this.tone(523, 0, 0.14, "sine", 0.14); this.tone(659, 0.13, 0.22, "sine", 0.14); } },
  fanfare() {
    if (!this.ensure()) return;
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.12, 0.35, "triangle", 0.22));
  }
};

["pointerdown", "touchend", "click"].forEach(ev => {
  document.addEventListener(ev, () => sound.unlock(), { passive: true });
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && sound.ctx && sound.ctx.state === "suspended") sound.ctx.resume();
});

/* ================================================================
   よみあげ（Web Speech API・日本語ボイス）
   Windows の Chrome は初回 getVoices() が空なので voiceschanged で拾い直す
================================================================ */
let voicesCache = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  voicesCache = speechSynthesis.getVoices() || [];
}
function jaVoices() { return voicesCache.filter(v => v.lang && /^ja/i.test(v.lang)); }
function pickJaVoice() {
  const uri = store.data.settings.voiceURI;
  if (uri) {
    const hit = voicesCache.find(v => v.voiceURI === uri);
    if (hit) return hit;
  }
  return jaVoices()[0] || null;
}
// 送りがなの ( ) は読み上げないで自然につなげる（「はや(い)」→「はやい」）
function plainYomi(y) { return String(y).replace(/[()（）]/g, ""); }

function enVoices() { return voicesCache.filter(v => v.lang && /^en/i.test(v.lang)); }
function hasEnVoice() { return enVoices().length > 0; }
// 英語ボイスが無い環境で日本語ボイスに英語を読ませると、
// カタカナ読みになって学習の妨げになる。だから鳴らさない（eigo-yomi と同じ方針）
function speakEn(text) {
  if (!("speechSynthesis" in window)) return false;
  const list = enVoices();
  const v = list.find(x => /en[-_]US/i.test(x.lang)) || list[0];
  if (!v) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = Math.min(1, store.data.settings.rate);
  u.voice = v;
  speechSynthesis.speak(u);
  return true;
}

function speak(text, force) {
  if (!("speechSynthesis" in window)) return false;
  if (!force && !store.data.settings.speak) return false;
  const v = pickJaVoice();
  if (!v) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plainYomi(text));
  u.lang = "ja-JP";
  u.rate = store.data.settings.rate;
  u.voice = v;
  speechSynthesis.speak(u);
  return true;
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", () => {
    loadVoices();
    if (document.getElementById("voice-select")) renderSettings();
  });
}

/* ================================================================
   紙吹雪
================================================================ */
const confetti = (() => {
  const canvas = document.getElementById("confetti-canvas");
  const ctx = canvas.getContext("2d");
  let parts = [], running = false;
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", resize); resize();
  const COLORS = ["#ffb84d","#6ecb63","#64b5f6","#f48fb1","#ffd54f","#b39ddb"];
  function burst(n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.3,
        vx: (Math.random() - 0.5) * 2,
        vy: 2 + Math.random() * 3,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.2,
        size: 8 + Math.random() * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts = parts.filter(p => p.y < canvas.height + 30);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    }
    if (parts.length > 0) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  return { burst };
})();

/* ================================================================
   出題するマスを選ぶ
================================================================ */
function buildPool() {
  const s = store.data.settings;
  return ITEMS.filter(i => {
    if (!s.subjects.includes(i.subject)) return false;
    if (!s.qtypes.includes(i.qtype)) return false;
    if (i.subject === "kanji") {
      if (s.lv !== 0 && i.k.lv !== s.lv) return false;
      if (s.grp !== "" && i.k.g !== s.grp) return false;
    }
    if (i.subject === "kuku") {
      if (s.dan !== 0 && i.a !== s.dan) return false;
    }
    return true;
  });
}

// にがて＝箱1にいて、1回でもまちがえたマス（絞り込みは無視して全部から拾う）
function reviewPool() {
  return ITEMS.filter(i => getBox(i.id) === 1 && statOf(i.id).ng > 0);
}

function doneCount() { return ITEMS.filter(i => getBox(i.id) === 3).length; }

function renderPoolInfo() {
  const pool = buildPool();
  const rev = reviewPool();
  const info = "いま " + pool.length + "マス ／ できた " + doneCount() + "／" + ITEMS.length;
  document.getElementById("pool-info").textContent = info;
  const info2 = document.getElementById("pool-info2");
  if (info2) info2.textContent = info;
  const rb = document.getElementById("btn-review");
  rb.disabled = rev.length === 0;
  rb.innerHTML = rev.length === 0
    ? '<span class="emoji">🔁</span>にがては ないよ'
    : '<span class="emoji">🔁</span>にがてを れんしゅう (' + rev.length + ')';
  document.querySelectorAll(".star-num").forEach(e => e.textContent = store.data.stars);
}

function weightOf(item) {
  const b = getBox(item.id);
  return b === 1 ? 6 : b === 2 ? 3 : 1;
}

// 苦手なマスほど当たりやすく。ただし同じ見出し（同じ漢字）は
// 候補がある限り1セットに1回までにする（同じ字が続くと飽きるため）
function pickItems(pool, n) {
  const rest = pool.slice();
  const out = [];
  let used = {};
  while (out.length < n && rest.length > 0) {
    let cand = rest.filter(i => !used[refKey(i)]);
    if (cand.length === 0) { used = {}; cand = rest.slice(); }
    let total = 0;
    for (const i of cand) total += weightOf(i);
    let r = Math.random() * total;
    let pick = cand[cand.length - 1];
    for (const i of cand) { r -= weightOf(i); if (r <= 0) { pick = i; break; } }
    out.push(pick);
    used[refKey(pick)] = true;
    rest.splice(rest.indexOf(pick), 1);
  }
  return out;
}

/* ================================================================
   マス → 問題
   ここから先（描画・判定）は choice.text / choice.kind / choice.correct しか見ない。
   教科を足すときは make〇〇Question を書いて makeQuestion から呼ぶだけでよい。
================================================================ */
function mkChoice(text, kind, correct) { return { text: text, kind: kind, correct: !!correct }; }

// 紛らわしすぎない選択肢を選ぶ
//   yomi … 同じ読みの漢字（日と火）は答えが2つになるので除外
//   exclude … ことば問題で、問題文にすでに出ている漢字を除外
function kanjiDistractors(target, kind, n, exclude, sameYomiOK) {
  const sameGroup = KANJI.filter(x => x.k !== target.k && x.g === target.g);
  const others    = KANJI.filter(x => x.k !== target.k && x.g !== target.g);
  let cand = shuffle(sameGroup).concat(shuffle(others));
  // 読みが同じ漢字は、どちらを選んでも正しくなってしまうので外す。
  // かんじ→よみ だけでなく **よみ→かんじ でも** 必要（「ひ」で 火 と 日 が並ぶと答えが2つ）
  if (!sameYomiOK) cand = cand.filter(x => plainYomi(x.y) !== plainYomi(target.y));
  if (exclude) cand = cand.filter(x => exclude.indexOf(x.k) < 0);
  const out = [], used = {};
  for (const c of cand) {
    const key = kind === "yomi" ? plainYomi(c.y) : c.k;
    if (used[key]) continue;
    used[key] = true;
    out.push(c);
    if (out.length >= n) break;
  }
  return out;
}

function makeQuestion(item, retry) {
  const q = { item: item, id: item.id, retry: !!retry, tries: 0 };
  if (item.subject === "kanji") return makeKanjiQuestion(q, item);
  if (item.subject === "kuku")  return makeKukuQuestion(q, item);
  if (item.subject === "eigo")  return makeEigoQuestion(q, item);
  return q;
}

function eigoDistractors(target, key, n) {
  const same   = EIGO.filter(x => x.en !== target.en && x.c === target.c);
  const others = EIGO.filter(x => x.en !== target.en && x.c !== target.c);
  const cand = shuffle(same).concat(shuffle(others));
  const out = [], used = {};
  used[target[key]] = true;
  for (const c of cand) {
    if (used[c[key]]) continue;
    used[c[key]] = true;
    out.push(c);
    if (out.length >= n) break;
  }
  return out;
}

function makeEigoQuestion(q, it) {
  const w = it.w;
  if (it.qtype === "ja2en") {
    q.label = "えいごで どれ？";
    q.emoji = w.e;
    q.main  = { text: w.ja, kind: "yomi" };
    q.speak = w.say || w.ja;
    q.speakAfterEn = w.en;   // 正解したら、その英単語を聞かせる
    q.choices = shuffle([mkChoice(w.en, "en", true)].concat(
      eigoDistractors(w, "en", 3).map(x => mkChoice(x.en, "en", false))));
  } else {
    // 絵文字は答えそのものになってしまうので出さない
    q.label = "どういう いみ？";
    q.main  = { text: w.en, kind: "en" };
    q.speakEn = w.en;
    q.speakJa = "どういう いみかな？";   // 英語ボイスが無い端末では、こちらだけ鳴る
    q.choices = shuffle([mkChoice(w.ja, "yomi", true)].concat(
      eigoDistractors(w, "ja", 3).map(x => mkChoice(x.ja, "yomi", false))));
  }
  return q;
}

const ALL_PRODUCTS = (() => {
  const set = {};
  for (let a = 1; a <= 9; a++) for (let b = 1; b <= 9; b++) set[a * b] = true;
  return Object.keys(set).map(Number);
})();

// ダミーは3種類を1つずつ。
//  ①段ちがい（9×7に対する 9×6＝ans-9）… 九九でいちばん起きるまちがい
//  ②1〜2ちがい … 数え間違い
//  ③まったく別の九九の答え … 全部が近い数だと、そもそも見分けがつかず苦行になる
function numDistractors(ans, a, b, n) {
  const used = {}; used[ans] = true;
  const out = [];
  const push = v => {
    if (v > 0 && v <= 81 && !used[v]) { used[v] = true; out.push(v); return true; }
    return false;
  };
  const rowShift = shuffle([ans + a, ans - a, ans + b, ans - b]);
  const near     = shuffle([ans + 1, ans - 1, ans + 2, ans - 2]);
  const others   = shuffle(ALL_PRODUCTS).filter(v => Math.abs(v - ans) > 2);
  for (const v of rowShift) if (push(v)) break;
  for (const v of near)     if (push(v)) break;
  for (const v of others)   if (push(v)) break;
  for (const v of rowShift.concat(near, others)) { if (out.length >= n) break; push(v); }
  return shuffle(out).slice(0, n);
}

function makeKukuQuestion(q, it) {
  const ans = it.a * it.b;
  q.label = "こたえは？";
  q.main  = { text: it.a + " × " + it.b, kind: "num" };
  q.speak = numYomi(it.a) + " かける " + numYomi(it.b) + " は？";
  q.speakAfter = numYomi(ans);   // 正解したら答えだけを言う
  q.choices = shuffle([mkChoice(String(ans), "num", true)].concat(
    numDistractors(ans, it.a, it.b, 3).map(v => mkChoice(String(v), "num", false))));
  return q;
}

function makeKanjiQuestion(q, it) {
  const k = it.k;
  if (it.qtype === "word") {
    const pair = k.w[Math.floor(Math.random() * k.w.length)];
    q.label = "□に はいる かんじは？";
    q.word  = { text: pair[0], target: k.k };
    q.sub   = "「" + pair[1] + "」";
    q.speak = pair[1];
    q.choices = shuffle([mkChoice(k.k, "kanji", true)].concat(
      kanjiDistractors(k, "kanji", 3, pair[0], true).map(x => mkChoice(x.k, "kanji", false))));
  } else if (it.qtype === "k2y") {
    q.label = "なんて よむ？";
    q.main  = { text: k.k, kind: "kanji" };
    q.speakJa = "なんて よむかな？";   // 漢字そのものを読むと答えになるので、かけ声だけ
    q.speakAfter = k.y;                 // 読みは答え合わせのときに聞かせる
    q.choices = shuffle([mkChoice(k.y, "yomi", true)].concat(
      kanjiDistractors(k, "yomi", 3).map(x => mkChoice(x.y, "yomi", false))));
  } else {
    q.label = "どの かんじ？";
    q.emoji = k.e;
    q.main  = { text: k.y, kind: "yomi" };
    q.speak = k.y;
    q.choices = shuffle([mkChoice(k.k, "kanji", true)].concat(
      kanjiDistractors(k, "kanji", 3).map(x => mkChoice(x.k, "kanji", false))));
  }
  return q;
}

// 結果・図鑑に出す「この問題は何だったか」の1行
function itemCaption(item) {
  if (item.subject === "kanji") {
    return item.k.y + " ／ " + item.k.w[0][0] + "（" + item.k.w[0][1] + "）";
  }
  if (item.subject === "kuku") {
    return item.a + " × " + item.b + " = " + (item.a * item.b);
  }
  if (item.subject === "eigo") {
    return item.w.en + " ＝ " + item.w.ja;
  }
  return "";
}
function itemHead(item) {
  if (item.subject === "kanji") return item.k.k;
  if (item.subject === "kuku")  return item.a + "×" + item.b;
  if (item.subject === "eigo")  return item.w.e;
  return "";
}

let session = null;

function isFishMode() { return store.data.settings.mode === "fish"; }

function startSession(review) {
  const pool = review ? reviewPool() : buildPool();
  if (pool.length === 0) return;
  const n = Math.min(store.data.settings.setSize, Math.max(pool.length, 1));
  const queue = pickItems(pool, n).map(it => makeQuestion(it));
  session = { queue: queue, idx: 0, total: queue.length, results: [], locked: false, review: !!review };
  document.getElementById("play-title").textContent = review ? "にがて れんしゅう" : "もんだい";
  showScreen("play");
  renderQuestion();
}

function endSession() {
  fishGame.stop();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  session = null;
}

// 問題数が多いときは丸を並べきれないので数字にする
function renderProgress() {
  const box = document.getElementById("progress");
  box.innerHTML = "";
  if (session.total > 10) {
    const t = document.createElement("div");
    t.className = "progress-num";
    t.textContent = (session.idx + 1) + " / " + session.total;
    box.appendChild(t);
    return;
  }
  for (let i = 0; i < session.total; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < session.idx ? " done" : i === session.idx ? " now" : "");
    box.appendChild(d);
  }
}

/* 問題文は、カードでも つりでも同じものを組み立てる */
function fillPrompt(box, q) {
  box.innerHTML = "";
  const label = document.createElement("div");
  label.className = "q-label";
  label.textContent = q.label;
  box.appendChild(label);

  if (q.emoji) {
    const em = document.createElement("div");
    em.className = "q-emoji"; em.textContent = q.emoji;
    box.appendChild(em);
  }

  if (q.word) {
    const w = document.createElement("div");
    w.className = "q-word";
    const i = q.word.text.indexOf(q.word.target);
    w.appendChild(document.createTextNode(q.word.text.slice(0, i)));
    const bl = document.createElement("span");
    bl.className = "blank"; bl.textContent = "□";
    w.appendChild(bl);
    w.appendChild(document.createTextNode(q.word.text.slice(i + q.word.target.length)));
    box.appendChild(w);
  } else if (q.main) {
    const m = document.createElement("div");
    m.className = q.main.kind === "kanji" ? "q-kanji"
                : q.main.kind === "num"   ? "q-num"
                : q.main.kind === "en"    ? "q-en" : "q-yomi";
    m.textContent = q.main.text;
    box.appendChild(m);
  }

  if (q.sub) {
    const sb = document.createElement("div");
    sb.className = "q-wordyomi"; sb.textContent = q.sub;
    box.appendChild(sb);
  }

  if (q.speak) {
    box.appendChild(speakButton(q.speak));
    speak(q.speak);
  } else if (q.speakEn && hasEnVoice()) {
    const b = speakButton(q.speakEn);
    b.onclick = null;
    b.addEventListener("click", e => { e.stopPropagation(); speakEn(q.speakEn); });
    box.appendChild(b);
    speakEn(q.speakEn);
  } else if (q.speakJa) {
    box.appendChild(speakButton(q.speakJa));
    speak(q.speakJa);
  }
}

function speakButton(text) {
  const b = document.createElement("button");
  b.className = "speak-btn";
  b.textContent = "🔊 もういちど きく";
  b.addEventListener("click", e => { e.stopPropagation(); speak(text, true); });
  return b;
}

// まちがえたときに、出題の読み上げをもう一度（答えになる問題では鳴らさない）
function repeatPrompt(q) {
  if (q.speak) speak(q.speak, true);
  else if (q.speakEn && hasEnVoice()) speakEn(q.speakEn);
  else if (q.speakJa) speak(q.speakJa, true);
}

function renderQuestion() {
  const q = session.queue[session.idx];
  session.locked = false;
  q.tries = 0;
  renderProgress();

  const fish = isFishMode();
  document.getElementById("card-area").hidden = fish;
  document.getElementById("fish-area").hidden = !fish;
  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";

  if (fish) {
    fillPrompt(document.getElementById("q-bar"), q);
    fishGame.start(q);
  } else {
    fishGame.stop();
    renderCardQuestion(q);
  }
}

/* ================================================================
   こたえ合わせ（カード・つり 共通）
   まちがえても先に進まない。正解するまで同じ問題に挑戦できる。
   成績に残すのは「1回目の答え」だけ。
================================================================ */
function recordFirstTry(q, ok) {
  const id = q.id;
  const st = store.data.stat[id] || { ok: 0, ng: 0 };
  if (ok) st.ok++; else st.ng++;
  store.data.stat[id] = st;

  store.data.box[id] = ok ? Math.min(3, getBox(id) + 1) : 1;
  if (ok) store.data.stars++;
  store.addRecord(ok);
  store.save();
  document.querySelectorAll(".star-num").forEach(e => e.textContent = store.data.stars);

  session.results.push({ item: q.item, ok: ok });
}

function answer(choice) {
  if (session.locked) return null;
  const q = session.queue[session.idx];
  q.tries++;
  if (q.tries === 1) recordFirstTry(q, choice.correct);
  if (choice.correct) { session.locked = true; sound.correct(); }
  else { sound.again(); }
  return choice.correct;
}

function afterCorrect(q) {
  if (q.speakAfterEn && hasEnVoice()) {
    speakEn(q.speakAfterEn);
    setTimeout(nextQuestion, 1500);
  } else if (q.speakAfter) {
    speak(q.speakAfter);
    setTimeout(nextQuestion, 1500);
  } else {
    setTimeout(nextQuestion, 900);
  }
}

function nextQuestion() {
  if (!session) return;
  session.idx++;
  if (session.idx >= session.queue.length) finishSession();
  else renderQuestion();
}

/* ================================================================
   カードモード
================================================================ */
function renderCardQuestion(q) {
  fillPrompt(document.getElementById("q-card"), q);

  const box = document.getElementById("choices");
  box.innerHTML = "";
  q.choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice";
    const span = document.createElement("span");
    span.className = c.kind === "kanji" ? "kanji" : c.kind === "num" ? "num" : c.kind === "en" ? "en" : "yomi";
    span.textContent = c.text;
    b.setAttribute("aria-label", c.text);
    b.appendChild(span);
    b.addEventListener("click", () => onCardChoice(b, c));
    box.appendChild(b);
  });
}

function onCardChoice(btn, choice) {
  if (btn.disabled) return;
  const q = session.queue[session.idx];
  const ok = answer(choice);
  if (ok === null) return;
  const fb = document.getElementById("feedback");

  if (ok) {
    btn.classList.add("ok");
    Array.from(document.getElementById("choices").children).forEach(b => {
      b.disabled = true;
      if (b !== btn) b.classList.add("dim");
    });
    fb.textContent = q.tries === 1 ? "せいかい！ ⭕" : "できたね！ ⭕";
    fb.className = "feedback";
    afterCorrect(q);
  } else {
    // まちがえたカードだけ引っ込めて、同じ問題を続ける
    btn.classList.add("ng", "dim");
    btn.disabled = true;
    fb.textContent = "ちがうよ、もういちど！";
    fb.className = "feedback again";
    repeatPrompt(q);
  }
}

/* ================================================================
   さかなつりモード
   選択肢を泳がせるだけで、出題・正誤・ライトナー箱はカードと共通。
   ねこ（ハチワレ）は kanji-fishing の cat.js を移植した。
================================================================ */
const fishGame = (() => {
  const canvas = document.getElementById("fish-canvas");
  const ctx = canvas.getContext("2d");
  const COLORS = ["#4fc3f7", "#81c784", "#ffb74d", "#f06292", "#ba68c8", "#4db6ac", "#ff8a65"];
  const PRAISE = ["やったー！せいかい！", "すごい！！", "かっこいい！", "てんさい！！", "やるね〜！"];

  let fishes = [], particles = [], raf = 0, running = false;
  let W = 0, H = 0, waterY = 0, t0 = Date.now();
  const cat = { state: "idle", speech: "", timer: 0, bounce: 0, blinkT: 0, blinking: false };

  // 漢字は明朝、よみはまるゴシック。
  // 文字数で切り替えると「て」と「ちから」で書体が変わってしまうので、種類で決める
  function fishFont(text, kind) {
    if (kind === "kanji") return 'bold 30px "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif';
    if (kind === "num")   return 'bold 28px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif';
    if (kind === "en")    return 'bold ' + (text.length <= 3 ? 26 : text.length <= 5 ? 23 : 20) + 'px "Segoe UI","Helvetica Neue",Arial,sans-serif';
    const n = text.length;
    const size = n <= 2 ? 25 : n <= 4 ? 22 : 18;
    return 'bold ' + size + 'px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif';
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    W = Math.max(260, Math.round(r.width));
    H = Math.max(240, Math.round(r.height));
    waterY = Math.round(H * 0.22);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 1匹ずつ別のレーンを泳がせる（重ならないので、押し間違いが起きない）
  function layout() {
    const n = fishes.length;
    const band = H - waterY - 14;
    fishes.forEach((f, i) => {
      f.laneY = waterY + 10 + band * ((i + 0.5) / n);
      f.minX = f.w / 2 + 30;   // 尾びれのぶんの余白
      f.maxX = W - f.w / 2 - (f.laneY > H - 130 ? 124 : 30); // 下のレーンはねこを避ける
      if (f.maxX < f.minX + 20) f.maxX = f.minX + 20;
      f.x = Math.min(Math.max(f.x, f.minX), f.maxX);
    });
  }

  function start(q) {
    resize();
    particles = [];
    fishes = q.choices.map((c, i) => {
      const text = c.text;
      ctx.font = fishFont(text, c.kind);
      const w = Math.max(86, Math.round(ctx.measureText(text).width) + 54);
      return {
        choice: c, text: text, kind: c.kind,
        w: w, h: Math.round(w * 0.58),
        x: 0, laneY: 0, phase: Math.random() * Math.PI * 2,
        speed: 0.45 + Math.random() * 0.6,
        dir: Math.random() < 0.5 ? 1 : -1,
        color: COLORS[i % COLORS.length],
        state: "swim", anim: 0
      };
    });
    fishes.forEach(f => { f.x = 40 + Math.random() * Math.max(40, W - 120); });
    layout();
    // ループは毎回張り直す。running フラグを信じて張り直さないと、
    // 何かの拍子にコマが止まったとき「魚のいない青い画面」のまま復帰できない
    if (raf) cancelAnimationFrame(raf);
    running = true;
    drawFrame();                       // リサイズでクリアされた直後を空のままにしない
    raf = requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    fishes = []; particles = [];
    say("", "idle");
  }

  function say(text, state) {
    cat.state = state || "idle";
    cat.speech = text || "";
    cat.timer = text ? 170 : 0;
    if (state === "happy") cat.bounce = 10;
  }

  /* ---- タップ ---- */
  canvas.addEventListener("pointerdown", e => {
    if (!running || !session) return;
    const r = canvas.getBoundingClientRect();
    const px = (e.clientX - r.left) * (W / r.width);
    const py = (e.clientY - r.top) * (H / r.height);
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (f.state !== "swim") continue;
      const fy = f.laneY + Math.sin((Date.now() - t0) / 600 + f.phase) * 4;
      if (px > f.x - f.w / 2 && px < f.x + f.w / 2 && py > fy - f.h / 2 && py < fy + f.h / 2) {
        onTap(f, fy);
        return;
      }
    }
  });

  function onTap(f, fy) {
    const q = session.queue[session.idx];
    const ok = answer(f.choice);
    if (ok === null) return;
    if (ok) {
      f.state = "caught";
      burst(f.x, fy, "#ffd700");
      burst(f.x, fy, "#ff6b9d");
      say(q.tries === 1 ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : "できたね！", "happy");
      afterCorrect(q);
    } else {
      f.state = "gone";
      burst(f.x, fy, "#b0bec5");
      say("ちがうよ〜\nもういちど！", "sad");
      repeatPrompt(q);
    }
  }

  function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = (Math.PI * 2 * i) / 14;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * (1.6 + Math.random() * 4),
        vy: Math.sin(a) * (1.6 + Math.random() * 4),
        life: 1, color: color, size: 6 + Math.random() * 7
      });
    }
  }

  /* ---- ループ ---- */
  let sizeTick = 0, lastFrame = 0;
  function loop() {
    if (!running) return;
    try { drawFrame(); }
    catch (e) { console.error("fish draw error", e); }   // 1コマ落ちてもループは続ける
    raf = requestAnimationFrame(loop);
  }

  function drawFrame() {
    lastFrame = Date.now();
    // 端末回転・ペインのリサイズ・アドレスバーの出入りを取りこぼさないよう、
    // 実寸をときどき見て変わっていたら作り直す
    if (++sizeTick % 15 === 0) {
      const r = canvas.getBoundingClientRect();
      if (Math.abs(Math.round(r.width) - W) > 2 || Math.abs(Math.round(r.height) - H) > 2) {
        resize(); layout();
      }
    }
    drawBackground();

    const now = Date.now();
    fishes.forEach(f => {
      if (f.state === "swim") {
        f.x += f.speed * f.dir;
        if (f.x > f.maxX) { f.x = f.maxX; f.dir = -1; }
        if (f.x < f.minX) { f.x = f.minX; f.dir = 1; }
      } else {
        f.anim += 1;
        if (f.state === "caught") f.y0 = (f.y0 || 0) - 6;
        else f.y0 = (f.y0 || 0) + 1.2;
      }
      drawFish(f, now);
    });

    // 先に寿命を減らしてから、消えたものを捨てる。
    // 減らす前にふるいにかけると life が負のまま描画に回り、
    // arc() の半径が負 → 例外 → 描画ループごと死ぬ（青い画面に魚が出ない不具合の原因だった）
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.022; });
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.5, p.size * p.life), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    updateCat();
    drawCat();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, waterY);
    sky.addColorStop(0, "#87ceeb");
    sky.addColorStop(1, "#b0e0ff");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, waterY);

    const water = ctx.createLinearGradient(0, waterY, 0, H);
    water.addColorStop(0, "#29b6d8");
    water.addColorStop(1, "#1565a0");
    ctx.fillStyle = water;
    ctx.fillRect(0, waterY, W, H - waterY);

    ctx.beginPath();
    ctx.arc(W * 0.12, waterY * 0.5, Math.min(22, waterY * 0.35), 0, Math.PI * 2);
    ctx.fillStyle = "#ffe066";
    ctx.fill();

    const t = Date.now() / 800;
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const wy = waterY + 8 + i * 20;
      ctx.moveTo(0, wy);
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, wy + Math.sin(x / 60 + t + i) * 4);
      ctx.stroke();
    }
  }

  function drawFish(f, now) {
    if (f.state !== "swim" && f.anim > 110) return;
    const y = f.laneY + (f.y0 || 0) + (f.state === "swim" ? Math.sin((now - t0) / 600 + f.phase) * 4 : 0);

    ctx.save();
    ctx.globalAlpha = f.state === "swim" ? 1 : Math.max(0, 1 - f.anim / 110);
    ctx.translate(f.x, y);
    ctx.scale(f.dir < 0 ? -1 : 1, 1);

    const color = f.state === "gone" ? "#90a4ae" : f.color;
    const w = f.w, h = f.h;
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";

    // 二股の尾びれ
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 6, 0);
    ctx.lineTo(-w / 2 - 26, -20);
    ctx.lineTo(-w / 2 - 12, 0);
    ctx.lineTo(-w / 2 - 26, 20);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill(); ctx.stroke();

    // 背びれ
    ctx.beginPath();
    ctx.moveTo(-10, -h / 2 + 4);
    ctx.quadraticCurveTo(6, -h / 2 - 20, 24, -h / 2 + 2);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill(); ctx.stroke();

    // からだ
    ctx.beginPath();
    ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill(); ctx.stroke();

    // しま模様（からだの中だけ）
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.32)";
    [-w * 0.22, w * 0.02, w * 0.26].forEach(x => {
      ctx.save(); ctx.translate(x, 0); ctx.rotate(0.18);
      ctx.fillRect(-4, -h, 8, h * 2);
      ctx.restore();
    });
    ctx.restore();

    // 胸びれ
    ctx.beginPath();
    ctx.ellipse(2, h / 2 - 3, 13, 7, Math.PI / 4.5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill(); ctx.stroke();

    // め
    ctx.beginPath();
    ctx.arc(w / 2 - 15, -8, 6.5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath();
    ctx.arc(w / 2 - 13, -8, 3.6, 0, Math.PI * 2);
    ctx.fillStyle = "#333"; ctx.fill();

    // 字（向きは戻してから描く）
    ctx.scale(f.dir < 0 ? -1 : 1, 1);
    ctx.font = fishFont(f.text, f.kind);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 4;
    ctx.fillText(f.text, 0, 2);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* ---- ねこ（実物の写真がモチーフ・おすわりのちび体型） ----
     黒い体と黒いしっぽ。白は「鼻すじ→口もと→あご→むね」の帯と、まえあしのくつ下だけ。
     **目は黒い毛の中**に置く（写真のとおり）。顔のパーツは頭の上半分に寄せる。
     表情は state（idle / happy / sad）で目と口だけを差し替える。 */
  const CAT_BLACK = "#3a3532", CAT_LINE = "#26221f", CAT_WHITE = "#fdfbf7";
  const CAT_EYE = "#b3c96b", CAT_PINK = "#f2a3ae";

  function drawCatFigure(ctx, state, blinking) {
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    // しっぽ（黒）
    ctx.beginPath();
    ctx.moveTo(26, 54);
    ctx.quadraticCurveTo(70, 52, 60, 14);
    ctx.strokeStyle = CAT_LINE; ctx.lineWidth = 14; ctx.stroke();
    ctx.strokeStyle = CAT_BLACK; ctx.lineWidth = 10; ctx.stroke();

    // からだ（黒・おすわり）
    ctx.beginPath();
    ctx.moveTo(-30, 64);
    ctx.quadraticCurveTo(-35, 26, -18, 13);
    ctx.quadraticCurveTo(0, 5, 18, 13);
    ctx.quadraticCurveTo(35, 26, 30, 64);
    ctx.quadraticCurveTo(0, 73, -30, 64);
    ctx.closePath();
    ctx.fillStyle = CAT_BLACK; ctx.fill();
    ctx.strokeStyle = CAT_LINE; ctx.lineWidth = 2.4; ctx.stroke();

    // むねの白（あごから下へ流れる帯）
    ctx.save();
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(-13, 4);
    ctx.quadraticCurveTo(-19, 38, -10, 66);
    ctx.lineTo(10, 66);
    ctx.quadraticCurveTo(19, 38, 13, 4);
    ctx.closePath();
    ctx.fillStyle = CAT_WHITE; ctx.fill();
    ctx.restore();

    // まえあし（白いくつ下）
    [-14, 14].forEach(x => {
      ctx.beginPath();
      ctx.ellipse(x, 61, 11, 7.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = CAT_WHITE; ctx.fill();
      ctx.strokeStyle = CAT_LINE; ctx.lineWidth = 2.2; ctx.stroke();
    });

    // みみ（黒・中はうすいピンク）
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s * 34, -34); ctx.lineTo(s * 30, -76); ctx.lineTo(s * 5, -52);
      ctx.closePath();
      ctx.fillStyle = CAT_BLACK; ctx.fill();
      ctx.strokeStyle = CAT_LINE; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s * 29, -41); ctx.lineTo(s * 27, -68); ctx.lineTo(s * 13, -52);
      ctx.closePath();
      ctx.fillStyle = "rgba(242,163,174,0.75)"; ctx.fill();
    });

    // あたま（黒）
    ctx.beginPath();
    ctx.arc(0, -16, 42, 0, Math.PI * 2);
    ctx.fillStyle = CAT_BLACK; ctx.fill();
    ctx.strokeStyle = CAT_LINE; ctx.lineWidth = 2.4; ctx.stroke();

    // 鼻すじから口もと・あごへ抜ける白（八割れ）
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, -16, 42, 0, Math.PI * 2);
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(0, -46);                        // 頭のてっぺん（-58）より下から始める
    ctx.quadraticCurveTo(-5, -40, -7, -20);    // 眉間はせまく
    ctx.quadraticCurveTo(-9, -8, -18, 2);      // 鼻すじから口もとへ広がる
    ctx.quadraticCurveTo(-21, 14, -13, 26);
    ctx.quadraticCurveTo(-6, 30, 0, 30);
    ctx.quadraticCurveTo(6, 30, 13, 26);
    ctx.quadraticCurveTo(21, 14, 18, 2);
    ctx.quadraticCurveTo(9, -8, 7, -20);
    ctx.quadraticCurveTo(5, -40, 0, -46);
    ctx.closePath();
    ctx.fillStyle = CAT_WHITE; ctx.fill();
    ctx.restore();

    // め（黒い毛の中。顔の上半分に置く）
    [-20, 20].forEach(x => {
      if (blinking) {
        ctx.beginPath();
        ctx.moveTo(x - 8, -18); ctx.quadraticCurveTo(x, -14, x + 8, -18);
        ctx.strokeStyle = CAT_WHITE; ctx.lineWidth = 3; ctx.stroke();
        return;
      }
      if (state === "happy") {
        ctx.beginPath();
        ctx.moveTo(x - 9, -15); ctx.quadraticCurveTo(x, -27, x + 9, -15);
        ctx.strokeStyle = CAT_WHITE; ctx.lineWidth = 3.4; ctx.stroke();
        return;
      }
      const ry = state === "sad" ? 6.5 : 10.5;
      ctx.beginPath();
      ctx.ellipse(x, -18, 9, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = CAT_EYE; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1.4; ctx.stroke();
      // ひとみ
      ctx.beginPath();
      ctx.ellipse(x, -18, 3.4, Math.min(ry - 1.5, 8), 0, 0, Math.PI * 2);
      ctx.fillStyle = "#24201d"; ctx.fill();
      ctx.beginPath();
      ctx.arc(x - 3.2, -22, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = "#fff"; ctx.fill();
    });

    // はな（白い帯の上）
    ctx.beginPath();
    ctx.moveTo(0, 6); ctx.lineTo(-4.6, 1); ctx.lineTo(4.6, 1);
    ctx.closePath();
    ctx.fillStyle = CAT_PINK; ctx.fill();

    // くち
    ctx.strokeStyle = "#6b5f58"; ctx.lineWidth = 2;
    if (state === "happy") {
      ctx.beginPath(); ctx.arc(0, 7, 8, 0.25, Math.PI - 0.25); ctx.stroke();
    } else if (state === "sad") {
      ctx.beginPath(); ctx.arc(0, 19, 8, Math.PI + 0.3, -0.3); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, 10); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-7, 10); ctx.quadraticCurveTo(-3.5, 14, 0, 10);
      ctx.quadraticCurveTo(3.5, 14, 7, 10);
      ctx.stroke();
    }

    // ひげ（黒い毛の上なので白）
    ctx.strokeStyle = "rgba(255,255,255,0.72)"; ctx.lineWidth = 1.5;
    [-1, 1].forEach(s => {
      ctx.beginPath(); ctx.moveTo(s * 17, 4); ctx.lineTo(s * 46, -4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * 18, 9); ctx.lineTo(s * 46, 10); ctx.stroke();
    });
  }

  function updateCat() {
    if (cat.timer > 0) cat.timer--;
    cat.blinkT++;
    if (cat.blinkT > 150) {
      cat.blinking = true;
      if (cat.blinkT > 158) { cat.blinking = false; cat.blinkT = 0; }
    }
    if (cat.bounce > 0) cat.bounce -= 0.5;
  }

  function drawCat() {
    const s = 0.58;
    const x = W - 62;
    const y = H - 48 - Math.abs(Math.sin(Date.now() / 400)) * 4 - cat.bounce;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    drawCatFigure(ctx, cat.state, cat.blinking);
    ctx.restore();
    if (cat.timer > 0 && cat.speech) drawBubble(x, y);
  }

  function drawBubble(x, y) {
    const lines = cat.speech.split("\n");
    ctx.font = 'bold 15px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif';
    let tw = 0;
    lines.forEach(l => { tw = Math.max(tw, ctx.measureText(l).width); });
    const bw = Math.min(W - 24, tw + 26);
    const bh = 18 + lines.length * 20;
    let bx = x - 46 - bw;
    if (bx < 8) bx = 8;
    const by = Math.max(4, y - 54 - bh);
    const r = 12;

    ctx.save();
    ctx.globalAlpha = Math.min(1, cat.timer / 20);
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bw - r, by);
    ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
    ctx.lineTo(bx + bw, by + bh - r);
    ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
    ctx.lineTo(bx + r, by + bh);
    ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
    ctx.lineTo(bx, by + r);
    ctx.quadraticCurveTo(bx, by, bx + r, by);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();
    ctx.strokeStyle = "#ffb84d";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(bx + bw - 14, by + bh);
    ctx.lineTo(bx + bw + 12, by + bh + 14);
    ctx.lineTo(bx + bw - 30, by + bh);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();

    ctx.fillStyle = "#5a4632";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + 19 + i * 20));
    ctx.restore();
  }

  addEventListener("resize", () => { if (running) { resize(); layout(); } });

  // 見張り番：動いているはずなのに1秒以上コマが進んでいなければループを張り直す
  setInterval(() => {
    if (!running || fishes.length === 0) return;
    if (document.hidden) return;
    if (Date.now() - lastFrame < 1000) return;
    if (raf) cancelAnimationFrame(raf);
    resize(); layout();
    raf = requestAnimationFrame(loop);
  }, 700);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && running && fishes.length > 0) {
      if (raf) cancelAnimationFrame(raf);
      resize(); layout();
      raf = requestAnimationFrame(loop);
    }
  });

  return { start: start, stop: stop, say: say, isRunning: () => running, fishes: () => fishes,
           debug: () => ({ running: running, raf: raf, fishes: fishes.length, W: W, H: H, age: Date.now() - lastFrame }) };
})();

function finishSession() {
  fishGame.stop();
  const res = session.results;
  const okN = res.filter(r => r.ok).length;
  const n = res.length;

  document.getElementById("result-big").textContent =
    okN === n ? "ぜんぶ せいかい！ 🎉" : okN >= n / 2 ? "よく できました！" : "がんばったね！";
  document.getElementById("result-stars").textContent = "⭐".repeat(Math.min(okN, 12)) +
    (okN > 12 ? " ×" + okN : "");

  const list = document.getElementById("result-list");
  list.innerHTML = "";
  const shown = res.slice(0, 12);
  shown.forEach(r => {
    const row = document.createElement("div");
    row.className = "result-row";
    const k = document.createElement("div"); k.className = "k"; k.textContent = itemHead(r.item);
    if (k.textContent.length > 1) k.style.fontSize = "19px";
    const t = document.createElement("div"); t.className = "t";
    t.textContent = qtypeLabel(r.item.qtype) + "／" + itemCaption(r.item);
    const m = document.createElement("div"); m.className = "m";
    m.textContent = r.ok ? "⭕" : "🔁";
    row.appendChild(k); row.appendChild(t); row.appendChild(m);
    if (r.item.subject === "kanji") row.addEventListener("click", () => openModal(r.item.k));
    list.appendChild(row);
  });
  if (res.length > shown.length) {
    const more = document.createElement("div");
    more.className = "result-row";
    more.innerHTML = '<div class="t" style="text-align:center">ほか ' + (res.length - shown.length) + 'もん</div>';
    list.appendChild(more);
  }

  const stamp = maybeAwardStamp();
  document.getElementById("stamp-pop").textContent = stamp ? "スタンプ ゲット！ " + stamp : "";

  showScreen("result");
  if (okN > 0) { sound.fanfare(); confetti.burst(okN === n ? 90 : 45); }
}

/* ================================================================
   かんじずかん
   1字につき3マス（よみ→かんじ / かんじ→よみ / ことば）。
   3つぜんぶ できたら 金色＋⭐。
================================================================ */
function kanjiProgress(k) {
  const boxes = qtypesOf("kanji").map(t => {
    const id = "kanji:" + k.k + ":" + t.id;
    return { qtype: t.id, label: t.label, box: getBox(id), tried: !!store.data.stat[id] };
  });
  return { boxes: boxes, done: boxes.filter(b => b.box === 3).length, tried: boxes.some(b => b.tried) };
}

let zukanTab = "kanji";

function renderZukan() {
  const tabs = document.getElementById("zukan-tabs");
  tabs.innerHTML = "";
  tabs.hidden = SUBJECTS.length < 2;
  SUBJECTS.forEach(sub => {
    const b = document.createElement("button");
    b.className = "chip" + (zukanTab === sub.id ? " on" : "");
    b.textContent = sub.label;
    b.addEventListener("click", () => { sound.tap(); zukanTab = sub.id; renderZukan(); });
    tabs.appendChild(b);
  });
  if (zukanTab === "kuku")      renderZukanKuku();
  else if (zukanTab === "eigo") renderZukanEigo();
  else                          renderZukanKanji();
}

function showZukanBox(which) {
  document.getElementById("zukan-grid").hidden = which !== "kanji";
  document.getElementById("kuku-table").hidden = which !== "kuku";
  document.getElementById("eigo-list").hidden  = which !== "eigo";
}

function eigoProgress(w) {
  return qtypesOf("eigo").map(t => {
    const id = "eigo:" + w.en + ":" + t.id;
    return { label: t.label, box: getBox(id), tried: !!store.data.stat[id] };
  });
}

function renderZukanEigo() {
  showZukanBox("eigo");
  const box = document.getElementById("eigo-list");
  box.innerHTML = "";
  const done = ITEMS.filter(i => i.subject === "eigo" && getBox(i.id) === 3).length;
  document.getElementById("zukan-legend").textContent =
    "できた " + done + " ／ " + (EIGO.length * 2) + "マス（" + EIGO.length + "ご × 2）";

  EIGO.forEach(w => {
    const p = eigoProgress(w);
    const n = p.filter(x => x.box === 3).length;
    const row = document.createElement("button");
    row.className = "erow " + (n === 2 ? "b3" : n === 1 ? "b2" : p.some(x => x.tried) ? "" : "new");
    row.innerHTML =
      '<span class="ee">' + w.e + '</span>' +
      '<span class="en">' + w.en + '</span>' +
      '<span class="ja">' + w.ja + '</span>' +
      '<span class="mk2">' + p.map(x => x.box === 3 ? "⭐" : x.box === 2 ? "🔵" : x.tried ? "🔁" : "・").join(" ") + '</span>';
    row.addEventListener("click", () => { sound.tap(); openEigoModal(w); });
    box.appendChild(row);
  });
}

function openEigoModal(w) {
  const m = document.getElementById("modal");
  m.innerHTML = "";
  const em = document.createElement("div"); em.style.fontSize = "56px"; em.textContent = w.e;
  const en = document.createElement("div");
  en.className = "mk";
  en.style.cssText = 'font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:clamp(40px,12vw,60px)';
  en.textContent = w.en;
  const ja = document.createElement("div"); ja.className = "my"; ja.textContent = w.ja;
  m.appendChild(em); m.appendChild(en); m.appendChild(ja);

  const tbl = document.createElement("div");
  tbl.className = "mtypes";
  eigoProgress(w).forEach(b => {
    const row = document.createElement("div");
    row.className = "mtype-row";
    row.innerHTML = "<span>" + b.label + "</span><span>" +
      (b.box === 3 ? "⭐" : b.box === 2 ? "🔵" : b.tried ? "🔁" : "・") + "</span>";
    tbl.appendChild(row);
  });
  m.appendChild(tbl);

  if (hasEnVoice()) {
    const sp = document.createElement("button");
    sp.className = "speak-btn"; sp.style.marginTop = "12px";
    sp.textContent = "🔊 きく";
    sp.addEventListener("click", () => speakEn(w.en));
    m.appendChild(sp);
  }
  const cl = document.createElement("button");
  cl.className = "big-btn btn-record"; cl.style.marginTop = "10px";
  cl.textContent = "とじる";
  cl.addEventListener("click", closeModal);
  m.appendChild(cl);
  document.getElementById("modal-back").classList.add("on");
}

function renderZukanKuku() {
  showZukanBox("kuku");
  const t = document.getElementById("kuku-table");
  t.innerHTML = "";
  const done = ITEMS.filter(i => i.subject === "kuku" && getBox(i.id) === 3).length;
  document.getElementById("zukan-legend").textContent = "できた " + done + " ／ 81マス";

  const corner = document.createElement("div");
  corner.className = "kcell head"; corner.textContent = "×";
  t.appendChild(corner);
  for (let b = 1; b <= 9; b++) {
    const h = document.createElement("div");
    h.className = "kcell head"; h.textContent = b;
    t.appendChild(h);
  }
  for (let a = 1; a <= 9; a++) {
    const h = document.createElement("div");
    h.className = "kcell head"; h.textContent = a;
    t.appendChild(h);
    for (let b = 1; b <= 9; b++) {
      const id = "kuku:" + a + "x" + b + ":mul";
      const box = getBox(id), tried = !!store.data.stat[id];
      const c = document.createElement("button");
      c.className = "kcell " + (box === 3 ? "b3" : box === 2 ? "b2" : tried ? "" : "new");
      c.textContent = a * b;
      c.addEventListener("click", () => { sound.tap(); openKukuModal(a, b); });
      t.appendChild(c);
    }
  }
}

function openKukuModal(a, b) {
  const m = document.getElementById("modal");
  const id = "kuku:" + a + "x" + b + ":mul";
  const box = getBox(id), st = statOf(id);
  m.innerHTML = "";
  const kk = document.createElement("div");
  kk.className = "mk"; kk.style.fontSize = "clamp(40px, 12vw, 64px)";
  kk.textContent = a + " × " + b + " = " + (a * b);
  m.appendChild(kk);
  const info = document.createElement("div");
  info.className = "mbox";
  info.textContent = (box === 3 ? "できた ⭐" : box === 2 ? "もうすこし 🔵" : st.ng > 0 ? "にがて 🔁" : "まだ やって いないよ")
    + "（⭕" + st.ok + " 🔁" + st.ng + "）";
  m.appendChild(info);
  const sp = document.createElement("button");
  sp.className = "speak-btn"; sp.style.marginTop = "12px";
  sp.textContent = "🔊 きく";
  sp.addEventListener("click", () => speak(numYomi(a) + " かける " + numYomi(b) + " は " + numYomi(a * b), true));
  m.appendChild(sp);
  const cl = document.createElement("button");
  cl.className = "big-btn btn-record"; cl.style.marginTop = "10px";
  cl.textContent = "とじる";
  cl.addEventListener("click", closeModal);
  m.appendChild(cl);
  document.getElementById("modal-back").classList.add("on");
}

function renderZukanKanji() {
  showZukanBox("kanji");
  const grid = document.getElementById("zukan-grid");
  grid.innerHTML = "";
  const gold = KANJI.filter(k => kanjiProgress(k).done === 3).length;
  document.getElementById("zukan-legend").textContent =
    "きんいろ ⭐" + gold + "もじ ／ " + KANJI.length + "もじ（3つの あそびかた ぜんぶ できたら きんいろ）";

  KANJI.forEach(k => {
    const p = kanjiProgress(k);
    const b = document.createElement("button");
    b.className = "zcell " + (p.done === 3 ? "b3" : p.done >= 1 ? "b2" : p.tried ? "" : "new");
    b.textContent = k.k;
    if (p.done === 3) {
      const m = document.createElement("span");
      m.className = "mark"; m.textContent = "⭐";
      b.appendChild(m);
    } else if (p.done > 0) {
      const m = document.createElement("span");
      m.className = "mark"; m.textContent = p.done + "/3";
      b.appendChild(m);
    }
    b.addEventListener("click", () => { sound.tap(); openModal(k); });
    grid.appendChild(b);
  });
}

function openModal(k) {
  const m = document.getElementById("modal");
  const p = kanjiProgress(k);
  m.innerHTML = "";

  const kk = document.createElement("div"); kk.className = "mk"; kk.textContent = k.k;

================================================================ */
/* おとなゲート
   選択式の一桁たし算だと子どもが通り抜けてしまうので、
   2けた×1けたを「数字を打って」答えてもらう */
let gateAnswer = 0, gateInput = "";

function renderGate() {
  const a = 12 + Math.floor(Math.random() * 18);   // 12〜29
  const b = 3 + Math.floor(Math.random() * 7);     // 3〜9
  gateAnswer = a * b;
  gateInput = "";
  document.getElementById("gate-q").textContent = a + " × " + b + " = ?";
  document.getElementById("gate-msg").textContent = "";
  updateGateInput();

  const pad = document.getElementById("gate-pad");
  pad.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(key => {
    const btn = document.createElement("button");
    btn.textContent = key;
    if (key === "OK") btn.style.color = "#43a865";
    btn.addEventListener("click", () => onGateKey(key));
    pad.appendChild(btn);
  });
}

function updateGateInput() {
  document.getElementById("gate-input").textContent = gateInput === "" ? "_" : gateInput;
}

function onGateKey(key) {
  if (key === "←") { gateInput = gateInput.slice(0, -1); updateGateInput(); return; }
  if (key === "OK") {
    if (parseInt(gateInput, 10) === gateAnswer) showScreen("settings");
    else { document.getElementById("gate-msg").textContent = "ちがいます"; renderGate(); }
    return;
  }
  if (gateInput.length < 3) { gateInput += key; updateGateInput(); }
}

/* ================================================================
   版の確認と読み直し
   iOS のホーム画面アプリは、いちど掴んだ版をなかなか手放さない。
   起動のたびに version.json（キャッシュ禁止）を見て、
   自分の APP_VERSION と違っていたらキャッシュを捨てて読み直す。
================================================================ */
async function hardRefresh() {
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch (e) {}
  location.replace(location.pathname + "?v=" + Date.now());
}

async function checkVersion() {
  try {
    const r = await fetch("version.json?cb=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (!j || !j.v || j.v === APP_VERSION) return;
    // 読み直したのにまだ古い、という無限ループを避ける（1タブ1回だけ）
    const guard = "vcheck:" + j.v;
    if (sessionStorage.getItem(guard)) return;
    sessionStorage.setItem(guard, "1");
    await hardRefresh();
  } catch (e) {}
}
window.addEventListener("load", () => { setTimeout(checkVersion, 800); });
