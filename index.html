<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>かんじあつめ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #ffeede 0%, #fff6e0 45%, #e4f5e6 100%);
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; }

  .screen {
    display: none;
    width: 100%; height: 100%;
    max-width: 820px;
    margin: 0 auto;
    flex-direction: column;
    align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  h1 {
    font-size: clamp(26px, 7vw, 40px);
    color: #d2603a;
    text-shadow: 2px 2px 0 #fff;
    margin: 14px 0 2px;
    text-align: center;
  }
  .subtitle { color: #a0704a; font-size: 16px; margin-bottom: 10px; text-align: center; }

  /* ===== ボタン ===== */
  .big-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%;
    min-height: 74px;
    margin: 7px 0;
    border: none;
    border-radius: 24px;
    font-family: inherit;
    font-size: clamp(20px, 5.5vw, 28px);
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
  .big-btn .emoji { font-size: 1.3em; }
  .big-btn:disabled { opacity: 0.45; cursor: default; }
  .btn-start  { background: linear-gradient(180deg, #ffb84d, #ff9b26); }
  .btn-review { background: linear-gradient(180deg, #7fc4f5, #4a9ad8); }
  .btn-zukan  { background: linear-gradient(180deg, #6ecb8b, #43a865); }
  .btn-record { background: linear-gradient(180deg, #b39ddb, #9575cd); }
  .btn-gate   { background: linear-gradient(180deg, #b0bec5, #90a4ae); }

  .top-bar {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    padding: 4px 0 6px;
    min-height: 52px;
  }
  .back-btn {
    border: none; background: #fff; color: #d2603a;
    font-family: inherit; font-size: 17px; font-weight: bold;
    padding: 10px 18px; border-radius: 20px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12); cursor: pointer;
    flex-shrink: 0; white-space: nowrap;
  }
  .back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  .screen-title { font-size: 21px; font-weight: bold; color: #d2603a; text-align: center; }
  .star-count {
    background: #fff; border-radius: 20px; padding: 8px 14px;
    font-size: 18px; font-weight: bold; color: #e8a000;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    flex-shrink: 0; white-space: nowrap;
  }
  @media (max-width: 480px) {
    .back-btn { font-size: 15px; padding: 8px 12px; }
    .screen-title { font-size: 17px; }
    .star-count { font-size: 15px; padding: 6px 10px; }
  }

  /* ===== チップ ===== */
  .chip-row { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; margin: 3px 0 6px; }
  .chip {
    border: 3px solid #ffb84d; background: #fff; color: #c96a1e;
    font-family: inherit; font-size: 15px; font-weight: bold;
    padding: 8px 13px; border-radius: 18px; cursor: pointer;
    min-height: 42px;
  }
  .chip.on { background: #ffb84d; color: #fff; }
  .chip.q { border-color: #6ecb8b; color: #2e8a52; }
  .chip.q.on { background: #6ecb8b; color: #fff; }
  .pick-label { font-size: 15px; font-weight: bold; color: #a0704a; margin-top: 8px; }
  .pool-info { font-size: 15px; color: #a0704a; margin: 2px 0 6px; min-height: 20px; text-align: center; }

  /* ===== 問題カード ===== */
  .q-card {
    width: 100%;
    background: #fff;
    border-radius: 30px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    padding: clamp(12px, 3vw, 24px) clamp(10px, 3vw, 26px);
    margin: 4px 0 8px;
    min-height: clamp(120px, 20vh, 180px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
  }
  .q-label { font-size: clamp(15px, 4vw, 19px); color: #a0704a; font-weight: bold; }
  .q-emoji { font-size: clamp(34px, 9vw, 54px); line-height: 1.1; }
  .q-kanji {
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(72px, 22vw, 132px); line-height: 1.05; color: #3a3226; font-weight: bold;
  }
  .q-yomi { font-size: clamp(38px, 11vw, 64px); font-weight: bold; color: #d2603a; letter-spacing: 0.06em; }
  .q-word {
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(44px, 13vw, 76px); font-weight: bold; color: #3a3226; letter-spacing: 0.04em;
  }
  .q-word .blank { color: #d2603a; background: #ffeede; border-radius: 10px; padding: 0 0.12em; }
  .q-wordyomi { font-size: clamp(18px, 5vw, 26px); color: #a0704a; font-weight: bold; letter-spacing: 0.06em; }
  .speak-btn {
    border: none; background: #ffe2c0; color: #d2603a;
    font-family: inherit; font-size: 17px; font-weight: bold;
    padding: 10px 20px; border-radius: 22px; cursor: pointer; min-height: 46px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.10);
  }
  .speak-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.10); }

  /* ===== 選択肢 ===== */
  .choices { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .choice {
    border: none; background: #fff; cursor: pointer;
    border-radius: 24px; box-shadow: 0 5px 0 rgba(0,0,0,0.14);
    min-height: clamp(96px, 21vh, 168px);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; color: #3a3226;
    transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
  }
  .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.14); }
  .choice .kanji {
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(46px, 13vw, 78px); font-weight: bold; line-height: 1;
  }
  .choice .yomi { font-size: clamp(26px, 7.5vw, 40px); font-weight: bold; letter-spacing: 0.04em; }
  .choice.ok  { background: #c8f0cf; box-shadow: 0 5px 0 #7bc48c; animation: pop 0.32s ease; }
  .choice.ng  { background: #ffe0e0; box-shadow: 0 5px 0 #f0a8a8; }
  .choice.dim { opacity: 0.45; }
  @keyframes pop { 0%{transform:scale(1);} 45%{transform:scale(1.12);} 100%{transform:scale(1);} }

  .feedback { min-height: 42px; font-size: clamp(20px, 5.5vw, 28px); font-weight: bold; text-align: center; color: #43a865; }
  .feedback.again { color: #4a9ad8; }

  .progress { display: flex; gap: 6px; justify-content: center; margin: 2px 0 6px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px #e6c9a8; }
  .dot.done { background: #ffb84d; box-shadow: none; }
  .dot.now  { background: #d2603a; box-shadow: 0 0 0 3px #ffd9c0; }

  /* ===== けっか ===== */
  .result-big { font-size: clamp(30px, 8vw, 46px); font-weight: bold; color: #d2603a; margin: 10px 0 4px; text-align: center; }
  .result-stars { font-size: clamp(30px, 8vw, 44px); margin: 6px 0; text-align: center; word-break: break-all; }
  .result-list { width: 100%; background: #fff; border-radius: 22px; padding: 12px; margin: 8px 0; box-shadow: 0 4px 0 rgba(0,0,0,0.10); }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px dashed #f0e0cc; }
  .result-row:last-child { border-bottom: none; }
  .result-row .k { font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif; font-size: 32px; font-weight: bold; width: 46px; text-align: center; }
  .result-row .t { flex: 1; font-size: 16px; color: #6b5a46; }
  .result-row .m { font-size: 22px; }
  .stamp-pop { font-size: clamp(46px, 13vw, 70px); text-align: center; margin: 6px 0; }

  /* ===== ずかん ===== */
  .zukan-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; padding-bottom: 12px; }
  .zcell {
    aspect-ratio: 1 / 1; border: none; cursor: pointer;
    border-radius: 16px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    display: flex; align-items: center; justify-content: center;
    font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif;
    font-size: clamp(26px, 6.5vw, 36px); font-weight: bold; color: #3a3226;
    position: relative;
  }
  .zcell:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  .zcell.new { color: #c8bba8; background: #f6efe4; }
  .zcell.b2 { background: #ddf0ff; box-shadow: 0 3px 0 #a8cfe8; }
  .zcell.b3 { background: linear-gradient(180deg, #fff2c4, #ffdf8a); box-shadow: 0 3px 0 #e0b84d; }
  .zcell .mark { position: absolute; top: 1px; right: 4px; font-size: 12px; }
  .zukan-legend { font-size: 14px; color: #a0704a; text-align: center; margin: 2px 0 8px; }

  /* ===== モーダル ===== */
  .modal-back {
    position: fixed; inset: 0; background: rgba(60,40,20,0.45);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .modal-back.on { display: flex; }
  .modal {
    background: #fff; border-radius: 28px; padding: 20px; width: 100%; max-width: 400px;
    text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,0.18); max-height: 86vh; overflow-y: auto;
  }
  .modal .mk { font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif; font-size: clamp(76px, 22vw, 112px); font-weight: bold; line-height: 1.1; }
  .modal .my { font-size: 22px; font-weight: bold; color: #d2603a; margin: 4px 0; letter-spacing: 0.05em; }
  .modal .mw { font-size: 19px; color: #6b5a46; margin: 3px 0; }
  .modal .mw b { font-family: "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif; font-size: 24px; }
  .modal .mbox { font-size: 15px; color: #a0704a; margin-top: 8px; }

  /* ===== きろく ===== */
  .card { width: 100%; background: #fff; border-radius: 22px; padding: 14px; margin: 7px 0; box-shadow: 0 4px 0 rgba(0,0,0,0.10); }
  .card h3 { font-size: 17px; color: #d2603a; margin-bottom: 8px; }
  .stat-row { display: flex; justify-content: space-around; text-align: center; }
  .stat-row .n { font-size: 28px; font-weight: bold; color: #d2603a; }
  .stat-row .l { font-size: 13px; color: #a0704a; }
  .stamp-grid { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .stamp-grid span { font-size: 30px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 14px; color: #6b5a46; }
  .bar-row .d { width: 52px; flex-shrink: 0; }
  .bar { flex: 1; height: 16px; background: #f2e6d6; border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#ffb84d,#ff9b26); }
  .bar-row .v { width: 62px; text-align: right; flex-shrink: 0; }

  /* ===== せってい ===== */
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px dashed #f0e0cc; font-size: 16px; color: #6b5a46; }
  .set-row:last-child { border-bottom: none; }
  select, input[type=range] { font-family: inherit; font-size: 16px; }
  select { padding: 8px; border-radius: 12px; border: 2px solid #ffb84d; background: #fff; max-width: 60%; }
  .danger { background: linear-gradient(180deg,#ef9a9a,#e57373); }
  .gate-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; margin: 10px auto; }
  .gate-pad button { min-height: 62px; border: none; border-radius: 18px; background: #fff; font-family: inherit; font-size: 26px; font-weight: bold; color: #6b5a46; box-shadow: 0 4px 0 rgba(0,0,0,0.12); cursor: pointer; }
  .gate-msg { text-align: center; color: #a0704a; font-size: 15px; margin-top: 8px; min-height: 22px; }

  /* ===== さかなつりモード ===== */
  [hidden] { display: none !important; }
  #fish-area { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #fish-canvas {
    width: 100%; flex: 1; min-height: 240px; display: block;
    border-radius: 22px; background: #1565a0;
    box-shadow: 0 5px 0 rgba(0,0,0,0.14);
    touch-action: manipulation; cursor: pointer;
  }
  .q-bar {
    width: 100%; background: #fff; border-radius: 22px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    padding: 8px 14px 10px; margin-bottom: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .q-bar .q-label  { font-size: 14px; }
  .q-bar .q-emoji  { font-size: clamp(24px, 6vw, 34px); }
  .q-bar .q-kanji  { font-size: clamp(40px, 11vw, 62px); }
  .q-bar .q-yomi   { font-size: clamp(30px, 8vw, 44px); }
  .q-bar .q-word   { font-size: clamp(28px, 8vw, 46px); }
  .q-bar .q-wordyomi { font-size: clamp(15px, 4vw, 20px); }
  .q-bar .speak-btn { padding: 6px 16px; min-height: 38px; font-size: 15px; margin-top: 4px; }
  .choice:disabled { cursor: default; }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .spacer { flex: 1; min-height: 4px; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="app">

  <!-- ============ ホーム ============ -->
  <div class="screen active" id="screen-home">
    <h1>かんじあつめ</h1>
    <div class="subtitle">１ねんせいの かんじ ８０もじ</div>

    <div class="pick-label">あそびかた</div>
    <div class="chip-row" id="mode-chips"></div>

    <div class="pick-label">どの かんじ？</div>
    <div class="chip-row" id="level-chips"></div>
    <div class="chip-row" id="group-chips"></div>

    <div class="pick-label">もんだいの かたち</div>
    <div class="chip-row" id="qtype-chips"></div>

    <div class="pool-info" id="pool-info"></div>

    <button class="big-btn btn-start" id="btn-start"><span class="emoji">🎴</span>はじめる</button>
    <button class="big-btn btn-review" id="btn-review"><span class="emoji">🔁</span>にがてを れんしゅう</button>
    <button class="big-btn btn-zukan" data-go="zukan"><span class="emoji">📖</span>かんじずかん</button>
    <div class="spacer"></div>
    <button class="big-btn btn-record" data-go="record"><span class="emoji">⭐</span>きろく<span class="star-num">0</span></button>
    <button class="big-btn btn-gate" data-go="gate"><span class="emoji">🔒</span>おとなのひと</button>
  </div>

  <!-- ============ もんだい ============ -->
  <div class="screen" id="screen-play">
    <div class="top-bar">
      <button class="back-btn" id="btn-quit">やめる</button>
      <div class="screen-title" id="play-title">もんだい</div>
      <div class="star-count">⭐<span class="star-num">0</span></div>
    </div>
    <div class="progress" id="progress"></div>

    <div id="card-area" style="width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="q-card" id="q-card"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <div class="spacer"></div>
    </div>

    <div id="fish-area" hidden>
      <div class="q-bar" id="q-bar"></div>
      <canvas id="fish-canvas"></canvas>
    </div>
  </div>

  <!-- ============ けっか ============ -->
  <div class="screen" id="screen-result">
    <div class="result-big" id="result-big"></div>
    <div class="result-stars" id="result-stars"></div>
    <div class="stamp-pop" id="stamp-pop"></div>
    <div class="result-list" id="result-list"></div>
    <button class="big-btn btn-start" id="btn-again"><span class="emoji">🎴</span>もういちど</button>
    <button class="big-btn btn-zukan" data-go="zukan"><span class="emoji">📖</span>ずかんを みる</button>
    <button class="big-btn btn-record" data-go="home"><span class="emoji">🏠</span>おうちへ</button>
  </div>

  <!-- ============ ずかん ============ -->
  <div class="screen" id="screen-zukan">
    <div class="top-bar">
      <button class="back-btn" data-go="home">もどる</button>
      <div class="screen-title">かんじずかん</div>
      <div class="star-count">⭐<span class="star-num">0</span></div>
    </div>
    <div class="zukan-legend" id="zukan-legend"></div>
    <div class="zukan-grid" id="zukan-grid"></div>
  </div>

  <!-- ============ きろく ============ -->
  <div class="screen" id="screen-record">
    <div class="top-bar">
      <button class="back-btn" data-go="home">もどる</button>
      <div class="screen-title">きろく</div>
      <div class="star-count">⭐<span class="star-num">0</span></div>
    </div>
    <div id="record-body" style="width:100%"></div>
  </div>

  <!-- ============ おとなゲート ============ -->
  <div class="screen" id="screen-gate">
    <div class="top-bar">
      <button class="back-btn" data-go="home">もどる</button>
      <div class="screen-title">おとなのひと</div>
      <div style="width:60px"></div>
    </div>
    <p style="color:#6b5a46;text-align:center;margin-top:10px">こたえの かずを おしてね</p>
    <div class="result-big" id="gate-q"></div>
    <div class="gate-pad" id="gate-pad"></div>
    <div class="gate-msg" id="gate-msg"></div>
  </div>

  <!-- ============ せってい ============ -->
  <div class="screen" id="screen-settings">
    <div class="top-bar">
      <button class="back-btn" data-go="home">もどる</button>
      <div class="screen-title">せってい</div>
      <div style="width:60px"></div>
    </div>
    <div id="settings-body" style="width:100%"></div>
  </div>
</div>

<div class="modal-back" id="modal-back">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ================================================================
   小学1年生の配当漢字 80字
   k: 漢字 / y: 出題に使う代表よみ（ひらがな）/ ys: よみのバリエーション
   e: ヒント絵文字 / lv: レベル(1-4) / g: なかま
   w: ことば（漢字表記 / よみ）— その漢字を必ず含む
================================================================ */
const KANJI = [
  // ---- レベル1 ----
  { k:"一", y:"いち", ys:["いち","ひと(つ)"], e:"1️⃣", lv:1, g:"かず", w:[["一つ","ひとつ"],["一年生","いちねんせい"]] },
  { k:"二", y:"に", ys:["に","ふた(つ)"], e:"2️⃣", lv:1, g:"かず", w:[["二つ","ふたつ"],["二人","ふたり"]] },
  { k:"三", y:"さん", ys:["さん","み(っつ)"], e:"3️⃣", lv:1, g:"かず", w:[["三つ","みっつ"],["三かく","さんかく"]] },
  { k:"四", y:"し", ys:["し","よん","よ(っつ)"], e:"4️⃣", lv:1, g:"かず", w:[["四つ","よっつ"],["四かく","しかく"]] },
  { k:"五", y:"ご", ys:["ご","いつ(つ)"], e:"5️⃣", lv:1, g:"かず", w:[["五つ","いつつ"],["五円","ごえん"]] },
  { k:"六", y:"ろく", ys:["ろく","む(っつ)"], e:"6️⃣", lv:1, g:"かず", w:[["六つ","むっつ"],["六月","ろくがつ"]] },

/* ================================================================
   保存データ
   kanji-data … 成績・設定（1キーのみ。壊れても他に波及しない）
================================================================ */
const DEFAULT_DATA = {
  stars: 0,
  stamps: [],
  box: {},          // 漢字 -> 1..3（ライトナー箱）
  stat: {},         // 漢字 -> { ok, ng }
  days: {},         // "YYYY-MM-DD" -> { total, ok }
  settings: { speak: true, rate: 0.9, voiceURI: "", mode: "fish", lv: 0, grp: "", qtypes: ["y2k","k2y","word"] }
};

const store = {
  data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem("kanji-data")); } catch (e) { d = null; }
    this.data = Object.assign({}, DEFAULT_DATA, d || {});
    this.data.settings = Object.assign({}, DEFAULT_DATA.settings, (d && d.settings) || {});
    if (!Array.isArray(this.data.settings.qtypes) || this.data.settings.qtypes.length === 0) {
      this.data.settings.qtypes = ["y2k","k2y","word"];
    }
  },
  save() { try { localStorage.setItem("kanji-data", JSON.stringify(this.data)); } catch (e) {} },
  todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  },
  addRecord(ok) {
    const k = this.todayKey();
    const day = this.data.days[k] || { total: 0, ok: 0 };
    day.total++;
    if (ok) day.ok++;
    this.data.days[k] = day;
  }
};
store.load();

function findKanji(k) { return KANJI.find(x => x.k === k); }
function getBox(k) { return store.data.box[k] || 1; }
function isSeen(k) { return !!store.data.stat[k]; }
function statOf(k) { return store.data.stat[k] || { ok: 0, ng: 0 }; }

function maybeAwardStamp() {
  const earned = Math.floor(store.data.stars / STARS_PER_STAMP);
  if (earned > store.data.stamps.length) {
    const remain = STAMP_POOL.filter(s => !store.data.stamps.includes(s));
    if (remain.length === 0) return null;
    const pick = remain[Math.floor(Math.random() * remain.length)];
    store.data.stamps.push(pick);
    store.save();
    return pick;
  }
  return null;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ================================================================
   効果音（WebAudio・外部ファイルなし）
================================================================ */
const sound = {
  ctx: null,
  unlocked: false,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  // iOS Safari 対策。
  //  ・AudioContext は必ず「指で触った瞬間」に作って resume しないと、以後ずっと無音になる
  //  ・audioSession.type = "playback" を指定しないと、着信スイッチ（マナーモード）で
  //    WebAudio だけ消される（読み上げは鳴るのに効果音が鳴らない、という状態になる）
  unlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    const ctx = this.ensure();
    if (!ctx) return;
    if (this.unlocked) return;
    this.unlocked = true;
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) {}
  },
  tone(freq, start, dur, type, vol) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol || 0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },
  tap()     { if (this.ensure()) this.tone(660, 0, 0.08, "sine", 0.12); },
  correct() { if (this.ensure()) { this.tone(880, 0, 0.15); this.tone(1320, 0.15, 0.3); } },
  // まちがい用。叱る音にしない（やわらかい上向きの2音）
  again()   { if (this.ensure()) { this.tone(523, 0, 0.14, "sine", 0.14); this.tone(659, 0.13, 0.22, "sine", 0.14); } },
  fanfare() {
    if (!this.ensure()) return;
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.12, 0.35, "triangle", 0.22));
  }
};

["pointerdown", "touchend", "click"].forEach(ev => {
  document.addEventListener(ev, () => sound.unlock(), { passive: true });
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && sound.ctx && sound.ctx.state === "suspended") sound.ctx.resume();
});

/* ================================================================
   よみあげ（Web Speech API・日本語ボイス）
   Windows の Chrome は初回 getVoices() が空なので voiceschanged で拾い直す
================================================================ */
let voicesCache = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  voicesCache = speechSynthesis.getVoices() || [];
}
function jaVoices() { return voicesCache.filter(v => v.lang && /^ja/i.test(v.lang)); }
function pickJaVoice() {
  const uri = store.data.settings.voiceURI;
  if (uri) {
    const hit = voicesCache.find(v => v.voiceURI === uri);
    if (hit) return hit;
  }
  return jaVoices()[0] || null;
}
// 送りがなの ( ) は読み上げないで自然につなげる（「はや(い)」→「はやい」）
function plainYomi(y) { return String(y).replace(/[()（）]/g, ""); }

function speak(text, force) {
  if (!("speechSynthesis" in window)) return false;
  if (!force && !store.data.settings.speak) return false;
  const v = pickJaVoice();
  if (!v) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plainYomi(text));
  u.lang = "ja-JP";
  u.rate = store.data.settings.rate;
  u.voice = v;
  speechSynthesis.speak(u);
  return true;
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", () => {
    loadVoices();
    if (document.getElementById("voice-select")) renderSettings();
  });
}

function showScreen(name) {
  if (name !== "play" && typeof fishGame !== "undefined") fishGame.stop();
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.querySelectorAll(".star-num").forEach(e => e.textContent = store.data.stars);
  if (name === "zukan")    renderZukan();
  if (name === "record")   renderRecord();
  if (name === "gate")     renderGate();
  if (name === "settings") renderSettings();
  if (name === "home")     renderPoolInfo();
  document.querySelectorAll(".screen").forEach(s => s.scrollTop = 0);
}
document.querySelectorAll("[data-go]").forEach(btn => {
  btn.addEventListener("click", () => { sound.tap(); showScreen(btn.dataset.go); });
});

  const ctx = canvas.getContext("2d");
  let parts = [], running = false;
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", resize); resize();
  const COLORS = ["#ffb84d","#6ecb63","#64b5f6","#f48fb1","#ffd54f","#b39ddb"];
  function burst(n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.3,
        vx: (Math.random() - 0.5) * 2,
        vy: 2 + Math.random() * 3,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.2,
        size: 8 + Math.random() * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts = parts.filter(p => p.y < canvas.height + 30);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    }
    if (parts.length > 0) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  return { burst };
})();

/* ================================================================
   ホーム（レベル・なかま・もんだいの かたち えらび）
================================================================ */
function renderChips() {

      }
      store.save(); renderChips(); renderPoolInfo();

    qBox.appendChild(b);
  });
}

function buildPool() {
  const s = store.data.settings;
  return KANJI.filter(x => (s.lv === 0 || x.lv === s.lv) && (s.grp === "" || x.g === s.grp));
}
function reviewPool() {
  // にがて＝箱1にいて、1回でもまちがえた漢字
  const list = KANJI.filter(x => getBox(x.k) === 1 && statOf(x.k).ng > 0);
  return list;
}
function renderPoolInfo() {
  const pool = buildPool();
  const rev = reviewPool();
  const done = KANJI.filter(x => getBox(x.k) === 3).length;
  document.getElementById("pool-info").textContent =
    "この なかまは " + pool.length + "もじ ／ おぼえた " + done + "／" + KANJI.length;
  const rb = document.getElementById("btn-review");
  rb.disabled = rev.length === 0;
  rb.innerHTML = rev.length === 0
    ? '<span class="emoji">🔁</span>にがては ないよ'
    : '<span class="emoji">🔁</span>にがてを れんしゅう (' + rev.length + ')';
  document.querySelectorAll(".star-num").forEach(e => e.textContent = store.data.stars);
}

/* ================================================================
   出題
================================================================ */
function weightOf(k) {
  const b = getBox(k.k);
  return b === 1 ? 6 : b === 2 ? 3 : 1;
}
function pickKanji(pool, n) {
  const rest = pool.slice();
  const out = [];
  while (out.length < n && rest.length > 0) {
    let total = 0;
    for (const k of rest) total += weightOf(k);
    let r = Math.random() * total;
    let idx = 0;
    for (let i = 0; i < rest.length; i++) {
      r -= weightOf(rest[i]);
      if (r <= 0) { idx = i; break; }
    }
    out.push(rest.splice(idx, 1)[0]);
  }
  return out;
}

// 答えの漢字と紛らわしすぎない選択肢を3つ選ぶ
//   yomi … 同じ読みの漢字（日と火 など）は答えが2つになるので除外
//   exclude … ことば問題で、問題文にすでに出ている漢字を除外
function distractors(target, kind, n, exclude) {
  const sameGroup = KANJI.filter(x => x.k !== target.k && x.g === target.g);
  const others    = KANJI.filter(x => x.k !== target.k && x.g !== target.g);
  let cand = shuffle(sameGroup).concat(shuffle(others));
  if (kind === "yomi") cand = cand.filter(x => plainYomi(x.y) !== plainYomi(target.y));
  if (exclude) cand = cand.filter(x => exclude.indexOf(x.k) < 0);
  const out = [];
  const used = {};
  for (const c of cand) {
    const key = kind === "yomi" ? plainYomi(c.y) : c.k;
    if (used[key]) continue;
    used[key] = true;
    out.push(c);
    if (out.length >= n) break;
  }
  return out;
}

function makeQuestion(k, type, retry) {
  if (type === "word") {
    const pair = k.w[Math.floor(Math.random() * k.w.length)];
    return { type, k, retry: !!retry, word: pair[0], wordYomi: pair[1],
             choices: shuffle([k].concat(distractors(k, "kanji", 3, pair[0]))) };
  }
  if (type === "k2y") {
    return { type, k, retry: !!retry, choices: shuffle([k].concat(distractors(k, "yomi", 3))) };
  }
  return { type: "y2k", k, retry: !!retry, choices: shuffle([k].concat(distractors(k, "kanji", 3))) };
}

let session = null;

function isFishMode() { return store.data.settings.mode === "fish"; }

function startSession(review) {
  const pool = review ? reviewPool() : buildPool();
  if (pool.length === 0) return;
  const types = store.data.settings.qtypes;
  const picked = pickKanji(pool, Math.min(SET_SIZE, pool.length));
  const queue = picked.map(k => makeQuestion(k, types[Math.floor(Math.random() * types.length)]));
  session = { queue, idx: 0, total: queue.length, results: [], locked: false, review: !!review };
  document.getElementById("play-title").textContent = review ? "にがて れんしゅう" : "もんだい";
  showScreen("play");
  renderQuestion();
}

function endSession() {
  fishGame.stop();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  session = null;
}

function renderProgress() {
  const box = document.getElementById("progress");
  box.innerHTML = "";
  for (let i = 0; i < session.total; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < session.idx ? " done" : i === session.idx ? " now" : "");
    box.appendChild(d);
  }
}

/* 問題文（絵文字＋よみ／漢字／ことば）は、カードでも つりでも同じものを組み立てる */
function fillPrompt(box, q) {
  box.innerHTML = "";
  const label = document.createElement("div");
  label.className = "q-label";
  box.appendChild(label);

  if (q.type === "y2k") {
    label.textContent = "どの かんじ？";
    const em = document.createElement("div");
    em.className = "q-emoji"; em.textContent = q.k.e;
    const yo = document.createElement("div");
    yo.className = "q-yomi"; yo.textContent = q.k.y;
    box.appendChild(em); box.appendChild(yo);
    box.appendChild(speakButton(q.k.y));
    speak(q.k.y);
  } else if (q.type === "k2y") {
    label.textContent = "なんて よむ？";
    const kj = document.createElement("div");
    kj.className = "q-kanji"; kj.textContent = q.k.k;
    box.appendChild(kj);
  } else {
    label.textContent = "□に はいる かんじは？";
    const w = document.createElement("div");
    w.className = "q-word";
    const i = q.word.indexOf(q.k.k);
    w.appendChild(document.createTextNode(q.word.slice(0, i)));
    const bl = document.createElement("span");
    bl.className = "blank"; bl.textContent = "□";
    w.appendChild(bl);
    w.appendChild(document.createTextNode(q.word.slice(i + 1)));
    const wy = document.createElement("div");
    wy.className = "q-wordyomi"; wy.textContent = "「" + q.wordYomi + "」";
    box.appendChild(w); box.appendChild(wy);
    box.appendChild(speakButton(q.wordYomi));
    speak(q.wordYomi);
  }
}

function speakButton(text) {
  const b = document.createElement("button");
  b.className = "speak-btn";
  b.textContent = "🔊 もういちど きく";
  b.addEventListener("click", e => { e.stopPropagation(); speak(text, true); });
  return b;
}

// 出題時のヒント音声をもう一度（かんじ→よみ は答えになるので鳴らさない）
function repeatPrompt(q) {
  if (q.type === "y2k")  speak(q.k.y, true);
  if (q.type === "word") speak(q.wordYomi, true);
}

function renderQuestion() {
  const q = session.queue[session.idx];
  session.locked = false;
  q.tries = 0;
  renderProgress();

  const fish = isFishMode();
  document.getElementById("card-area").hidden = fish;
  document.getElementById("fish-area").hidden = !fish;
  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";

  if (fish) {
    fillPrompt(document.getElementById("q-bar"), q);
    fishGame.start(q);
  } else {
    fishGame.stop();
    renderCardQuestion(q);
  }
}

/* ================================================================
   こたえ合わせ（カード・つり 共通）
   まちがえても先に進まない。正解するまで同じ問題に挑戦できる。
   成績に残すのは「1回目の答え」だけ。
================================================================ */
function recordFirstTry(q, ok) {
  const key = q.k.k;
  const st = store.data.stat[key] || { ok: 0, ng: 0 };
  if (ok) st.ok++; else st.ng++;
  store.data.stat[key] = st;

  store.data.box[key] = ok ? Math.min(3, getBox(key) + 1) : 1;
  if (ok) store.data.stars++;
  store.addRecord(ok);
  store.save();
  document.querySelectorAll(".star-num").forEach(e => e.textContent = store.data.stars);

  session.results.push({ k: q.k, ok: ok, type: q.type });
}

function answer(choice) {
  if (session.locked) return null;
  const q = session.queue[session.idx];
  const ok = choice.k === q.k.k;
  q.tries++;
  if (q.tries === 1) recordFirstTry(q, ok);
  if (ok) { session.locked = true; sound.correct(); }
  else    { sound.again(); }
  return ok;
}

function afterCorrect(q) {
  if (q.type === "k2y") {
    speak(q.k.y);
    setTimeout(nextQuestion, 1500);
  } else {
    setTimeout(nextQuestion, 900);
  }
}

function nextQuestion() {
  if (!session) return;
  session.idx++;
  if (session.idx >= session.queue.length) finishSession();
  else renderQuestion();
}

/* ================================================================
   カードモード
================================================================ */
function renderCardQuestion(q) {
  fillPrompt(document.getElementById("q-card"), q);

  const box = document.getElementById("choices");
  box.innerHTML = "";
  q.choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice";
    const span = document.createElement("span");
    if (q.type === "k2y") { span.className = "yomi"; span.textContent = c.y; }
    else                  { span.className = "kanji"; span.textContent = c.k; }
    b.setAttribute("aria-label", q.type === "k2y" ? c.y : c.k);
    b.appendChild(span);
    b.addEventListener("click", () => onCardChoice(b, c));
    box.appendChild(b);
  });
}

function onCardChoice(btn, choice) {
  if (btn.disabled) return;
  const q = session.queue[session.idx];
  const ok = answer(choice);
  if (ok === null) return;
  const fb = document.getElementById("feedback");

  if (ok) {
    btn.classList.add("ok");
    Array.from(document.getElementById("choices").children).forEach(b => {
      b.disabled = true;
      if (b !== btn) b.classList.add("dim");
    });
    fb.textContent = q.tries === 1 ? "せいかい！ ⭕" : "できたね！ ⭕";
    fb.className = "feedback";
    afterCorrect(q);
  } else {
    // まちがえたカードだけ引っ込めて、同じ問題を続ける
    btn.classList.add("ng", "dim");
    btn.disabled = true;
    fb.textContent = "ちがうよ、もういちど！";
    fb.className = "feedback again";
    repeatPrompt(q);
  }
}

/* ================================================================
   さかなつりモード
   選択肢を泳がせるだけで、出題・正誤・ライトナー箱はカードと共通。
   ねこ（ハチワレ）は kanji-fishing の cat.js を移植した。
================================================================ */
const fishGame = (() => {
  const canvas = document.getElementById("fish-canvas");
  const ctx = canvas.getContext("2d");
  const COLORS = ["#4fc3f7", "#81c784", "#ffb74d", "#f06292", "#ba68c8", "#4db6ac", "#ff8a65"];
  const PRAISE = ["やったー！せいかい！", "すごい！！", "かっこいい！", "てんさい！！", "やるね〜！"];

  let fishes = [], particles = [], raf = 0, running = false;
  let W = 0, H = 0, waterY = 0, t0 = Date.now();
  const cat = { state: "idle", speech: "", timer: 0, bounce: 0, blinkT: 0, blinking: false };

  // 漢字は明朝、よみはまるゴシック。
  // 文字数で切り替えると「て」と「ちから」で書体が変わってしまうので、種類で決める
  function fishFont(text, isKanji) {
    if (isKanji) return 'bold 30px "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif';
    const n = text.length;
    const size = n <= 2 ? 25 : n <= 4 ? 22 : 18;
    return 'bold ' + size + 'px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif';
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    W = Math.max(260, Math.round(r.width));
    H = Math.max(240, Math.round(r.height));
    waterY = Math.round(H * 0.22);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 1匹ずつ別のレーンを泳がせる（重ならないので、押し間違いが起きない）
  function layout() {
    const n = fishes.length;
    const band = H - waterY - 14;
    fishes.forEach((f, i) => {
      f.laneY = waterY + 10 + band * ((i + 0.5) / n);
      f.minX = f.w / 2 + 24;   // 尾びれのぶんの余白
      f.maxX = W - f.w / 2 - (f.laneY > H - 130 ? 124 : 24); // 下のレーンはねこを避ける
      if (f.maxX < f.minX + 20) f.maxX = f.minX + 20;
      f.x = Math.min(Math.max(f.x, f.minX), f.maxX);
    });
  }

  function start(q) {
    resize();
    particles = [];
    const isKanji = q.type !== "k2y";
    fishes = q.choices.map((c, i) => {
      const text = q.type === "k2y" ? c.y : c.k;
      ctx.font = fishFont(text, isKanji);
      const w = Math.max(86, Math.round(ctx.measureText(text).width) + 54);
      return {
        choice: c, text: text, isKanji: isKanji,
        w: w, h: Math.round(w * 0.58),
        x: 0, laneY: 0, phase: Math.random() * Math.PI * 2,
        speed: 0.45 + Math.random() * 0.6,
        dir: Math.random() < 0.5 ? 1 : -1,
        color: COLORS[i % COLORS.length],
        state: "swim", anim: 0
      };
    });
    fishes.forEach(f => { f.x = 40 + Math.random() * Math.max(40, W - 120); });
    layout();
    // ループは毎回張り直す。running フラグを信じて張り直さないと、
    // 何かの拍子にコマが止まったとき「魚のいない青い画面」のまま復帰できない
    if (raf) cancelAnimationFrame(raf);
    running = true;
    drawFrame();                       // リサイズでクリアされた直後を空のままにしない
    raf = requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    fishes = []; particles = [];
    say("", "idle");
  }

  function say(text, state) {
    cat.state = state || "idle";
    cat.speech = text || "";
    cat.timer = text ? 170 : 0;
    if (state === "happy") cat.bounce = 10;
  }

  /* ---- タップ ---- */
  canvas.addEventListener("pointerdown", e => {
    if (!running || !session) return;
    const r = canvas.getBoundingClientRect();
    const px = (e.clientX - r.left) * (W / r.width);
    const py = (e.clientY - r.top) * (H / r.height);
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (f.state !== "swim") continue;
      const fy = f.laneY + Math.sin((Date.now() - t0) / 600 + f.phase) * 4;
      if (px > f.x - f.w / 2 && px < f.x + f.w / 2 && py > fy - f.h / 2 && py < fy + f.h / 2) {
        onTap(f, fy);
        return;
      }
    }
  });

  function onTap(f, fy) {
    const q = session.queue[session.idx];
    const ok = answer(f.choice);
    if (ok === null) return;
    if (ok) {
      f.state = "caught";
      burst(f.x, fy, "#ffd700");
      burst(f.x, fy, "#ff6b9d");
      say(q.tries === 1 ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : "できたね！", "happy");
      afterCorrect(q);
    } else {
      f.state = "gone";
      burst(f.x, fy, "#b0bec5");
      say("ちがうよ〜\nもういちど！", "sad");
      repeatPrompt(q);
    }
  }

  function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = (Math.PI * 2 * i) / 14;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * (1.6 + Math.random() * 4),
        vy: Math.sin(a) * (1.6 + Math.random() * 4),
        life: 1, color: color, size: 6 + Math.random() * 7
      });
    }
  }

  /* ---- ループ ---- */
  let sizeTick = 0, lastFrame = 0;
  function loop() {
    if (!running) return;
    try { drawFrame(); }
    catch (e) { console.error("fish draw error", e); }   // 1コマ落ちてもループは続ける
    raf = requestAnimationFrame(loop);
  }

  function drawFrame() {
    lastFrame = Date.now();
    // 端末回転・ペインのリサイズ・アドレスバーの出入りを取りこぼさないよう、
    // 実寸をときどき見て変わっていたら作り直す
    if (++sizeTick % 15 === 0) {
      const r = canvas.getBoundingClientRect();
      if (Math.abs(Math.round(r.width) - W) > 2 || Math.abs(Math.round(r.height) - H) > 2) {
        resize(); layout();
      }
    }
    drawBackground();

    const now = Date.now();
    fishes.forEach(f => {
      if (f.state === "swim") {
        f.x += f.speed * f.dir;
        if (f.x > f.maxX) { f.x = f.maxX; f.dir = -1; }
        if (f.x < f.minX) { f.x = f.minX; f.dir = 1; }
      } else {
        f.anim += 1;
        if (f.state === "caught") f.y0 = (f.y0 || 0) - 6;
        else f.y0 = (f.y0 || 0) + 1.2;
      }
      drawFish(f, now);
    });

    // 先に寿命を減らしてから、消えたものを捨てる。
    // 減らす前にふるいにかけると life が負のまま描画に回り、
    // arc() の半径が負 → 例外 → 描画ループごと死ぬ（青い画面に魚が出ない不具合の原因だった）
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.022; });
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.5, p.size * p.life), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    updateCat();
    drawCat();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, waterY);
    sky.addColorStop(0, "#87ceeb");
    sky.addColorStop(1, "#b0e0ff");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, waterY);

    const water = ctx.createLinearGradient(0, waterY, 0, H);
    water.addColorStop(0, "#29b6d8");
    water.addColorStop(1, "#1565a0");
    ctx.fillStyle = water;
    ctx.fillRect(0, waterY, W, H - waterY);

    ctx.beginPath();
    ctx.arc(W * 0.12, waterY * 0.5, Math.min(22, waterY * 0.35), 0, Math.PI * 2);
    ctx.fillStyle = "#ffe066";
    ctx.fill();

    const t = Date.now() / 800;
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const wy = waterY + 8 + i * 20;
      ctx.moveTo(0, wy);
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, wy + Math.sin(x / 60 + t + i) * 4);
      ctx.stroke();
    }
  }

  function drawFish(f, now) {
    if (f.state !== "swim" && f.anim > 110) return;
    const y = f.laneY + (f.y0 || 0) + (f.state === "swim" ? Math.sin((now - t0) / 600 + f.phase) * 4 : 0);

    ctx.save();
    ctx.globalAlpha = f.state === "swim" ? 1 : Math.max(0, 1 - f.anim / 110);
    ctx.translate(f.x, y);
    ctx.scale(f.dir < 0 ? -1 : 1, 1);

    const color = f.state === "gone" ? "#90a4ae" : f.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, f.w / 2, f.h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-f.w / 2 + 4, 0);
    ctx.lineTo(-f.w / 2 - 20, -15);
    ctx.lineTo(-f.w / 2 - 20, 15);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(4, f.h / 2 - 4, 14, 8, Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(f.w / 2 - 14, -7, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(f.w / 2 - 12, -7, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = "#333";
    ctx.fill();

    ctx.scale(f.dir < 0 ? -1 : 1, 1);
    ctx.font = fishFont(f.text, f.isKanji);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.55)";
    ctx.shadowBlur = 4;
    ctx.fillText(f.text, 0, 2);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* ---- ねこ（kanji-fishing の cat.js から移植・縮小） ---- */
  function updateCat() {
    if (cat.timer > 0) cat.timer--;
    cat.blinkT++;
    if (cat.blinkT > 120) {
      cat.blinking = true;
      if (cat.blinkT > 126) { cat.blinking = false; cat.blinkT = 0; }
    }
    if (cat.bounce > 0) cat.bounce -= 0.5;
  }

  function drawCat() {
    const s = 0.62;
    const x = W - 56;
    const y = H - 44 - Math.abs(Math.sin(Date.now() / 400)) * 4 - cat.bounce;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);

    ctx.beginPath(); ctx.ellipse(0, 35, 28, 35, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#f5f0e8"; ctx.fill();
    ctx.strokeStyle = "#ccc"; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.beginPath(); ctx.arc(0, -10, 38, 0, Math.PI * 2);
    ctx.fillStyle = "#f5f0e8"; ctx.fill(); ctx.stroke();

    // ハチワレ模様
    ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(-14, -18); ctx.lineTo(14, -18); ctx.closePath();
    ctx.fillStyle = "#333"; ctx.fill();

    [-1, 1].forEach(sd => {
      ctx.beginPath();
      ctx.moveTo(sd * 28, -40); ctx.lineTo(sd * 42, -65); ctx.lineTo(sd * 12, -48); ctx.closePath();
      ctx.fillStyle = "#f5f0e8"; ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sd * 28, -44); ctx.lineTo(sd * 38, -62); ctx.lineTo(sd * 16, -50); ctx.closePath();
      ctx.fillStyle = "#ffb3c1"; ctx.fill();
    });

    const eyeY = cat.state === "happy" ? -14 : -12;
    const eyeOpen = cat.blinking ? 2 : (cat.state === "sad" ? 5 : 8);
    [-14, 14].forEach(ex => {
      ctx.beginPath(); ctx.ellipse(ex, eyeY, 7, eyeOpen, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#333"; ctx.fill();
    });
    if (!cat.blinking) {
      [[-12, eyeY - 2], [16, eyeY - 2]].forEach(p => {
        ctx.beginPath(); ctx.arc(p[0], p[1], 2.5, 0, Math.PI * 2);
        ctx.fillStyle = "#fff"; ctx.fill();
      });
    }

    ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(-5, -6); ctx.lineTo(5, -6); ctx.closePath();
    ctx.fillStyle = "#ff9999"; ctx.fill();

    ctx.strokeStyle = "#555"; ctx.lineWidth = 2;
    ctx.beginPath();
    if (cat.state === "happy")     ctx.arc(0, 1, 10, 0.2, Math.PI - 0.2);
    else if (cat.state === "sad")  ctx.arc(0, 10, 10, Math.PI + 0.2, -0.2);
    else { ctx.moveTo(-8, 2); ctx.quadraticCurveTo(0, 6, 8, 2); }
    ctx.stroke();

    ctx.strokeStyle = "#aaa"; ctx.lineWidth = 1.5;
    [-1, 1].forEach(sd => {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(sd * 10, -4 + i * 5);
        ctx.lineTo(sd * 42, -8 + i * 6);
        ctx.stroke();
      }
    });

    ctx.beginPath(); ctx.moveTo(20, 60); ctx.quadraticCurveTo(55, 50, 50, 25);
    ctx.strokeStyle = "#e0d8c8"; ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.stroke();
    ctx.strokeStyle = "#ccc"; ctx.lineWidth = 2; ctx.stroke();

    ctx.restore();

    if (cat.timer > 0 && cat.speech) drawBubble(x, y);
  }

  function drawBubble(x, y) {
    const lines = cat.speech.split("\n");
    ctx.font = 'bold 15px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif';
    let tw = 0;
    lines.forEach(l => { tw = Math.max(tw, ctx.measureText(l).width); });
    const bw = Math.min(W - 24, tw + 26);
    const bh = 18 + lines.length * 20;
    let bx = x - 46 - bw;
    if (bx < 8) bx = 8;
    const by = Math.max(4, y - 54 - bh);
    const r = 12;

    ctx.save();
    ctx.globalAlpha = Math.min(1, cat.timer / 20);
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bw - r, by);
    ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
    ctx.lineTo(bx + bw, by + bh - r);
    ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
    ctx.lineTo(bx + r, by + bh);
    ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
    ctx.lineTo(bx, by + r);
    ctx.quadraticCurveTo(bx, by, bx + r, by);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();
    ctx.strokeStyle = "#ffb84d";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(bx + bw - 14, by + bh);
    ctx.lineTo(bx + bw + 12, by + bh + 14);
    ctx.lineTo(bx + bw - 30, by + bh);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();

    ctx.fillStyle = "#5a4632";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + 19 + i * 20));
    ctx.restore();
  }

  addEventListener("resize", () => { if (running) { resize(); layout(); } });

  // 見張り番：動いているはずなのに1秒以上コマが進んでいなければループを張り直す
  setInterval(() => {
    if (!running || fishes.length === 0) return;
    if (document.hidden) return;
    if (Date.now() - lastFrame < 1000) return;
    if (raf) cancelAnimationFrame(raf);
    resize(); layout();
    raf = requestAnimationFrame(loop);
  }, 700);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && running && fishes.length > 0) {
      if (raf) cancelAnimationFrame(raf);
      resize(); layout();
      raf = requestAnimationFrame(loop);
    }
  });

  return { start: start, stop: stop, say: say, isRunning: () => running, fishes: () => fishes,
           debug: () => ({ running: running, raf: raf, fishes: fishes.length, W: W, H: H, age: Date.now() - lastFrame }) };
})();

function finishSession() {
  fishGame.stop();
  const res = session.results;
  const okN = res.filter(r => r.ok).length;
  const n = res.length;

  document.getElementById("result-big").textContent =
    okN === n ? "ぜんぶ せいかい！ 🎉" : okN >= n / 2 ? "よく できました！" : "がんばったね！";
  document.getElementById("result-stars").textContent = "⭐".repeat(Math.min(okN, 12));

  const list = document.getElementById("result-list");
  list.innerHTML = "";
  const seen = {};
  res.forEach(r => {
    if (seen[r.k.k]) return;
    seen[r.k.k] = true;
    const row = document.createElement("div");
    row.className = "result-row";
    const k = document.createElement("div"); k.className = "k"; k.textContent = r.k.k;
    const t = document.createElement("div"); t.className = "t";
    t.textContent = r.k.y + " ／ " + r.k.w[0][0] + "（" + r.k.w[0][1] + "）";
    const m = document.createElement("div"); m.className = "m";
    m.textContent = res.filter(x => x.k.k === r.k.k).every(x => x.ok) ? "⭕" : "🔁";
    row.appendChild(k); row.appendChild(t); row.appendChild(m);
    row.addEventListener("click", () => openModal(r.k));
    list.appendChild(row);
  });

  const stamp = maybeAwardStamp();
  document.getElementById("stamp-pop").textContent = stamp ? "スタンプ ゲット！ " + stamp : "";

  showScreen("result");
  if (okN > 0) { sound.fanfare(); confetti.burst(okN === n ? 90 : 45); }
}

/* ================================================================
   かんじずかん
================================================================ */
function renderZukan() {
  const grid = document.getElementById("zukan-grid");
  grid.innerHTML = "";
  const done = KANJI.filter(x => getBox(x.k) === 3).length;
  const met  = KANJI.filter(x => isSeen(x.k)).length;
  document.getElementById("zukan-legend").textContent =
    "であった " + met + "もじ ／ おぼえた ⭐" + done + "もじ（ぜんぶで " + KANJI.length + "もじ）";

  KANJI.forEach(k => {
    const b = document.createElement("button");
    const box = getBox(k.k);
    b.className = "zcell " + (!isSeen(k.k) ? "new" : "b" + box);
    b.textContent = k.k;
    if (isSeen(k.k) && box === 3) {
      const m = document.createElement("span");
      m.className = "mark"; m.textContent = "⭐";
      b.appendChild(m);
    }
    b.addEventListener("click", () => { sound.tap(); openModal(k); });
    grid.appendChild(b);
  });
}

function openModal(k) {
  const m = document.getElementById("modal");
  const st = statOf(k.k);
  const box = getBox(k.k);
  m.innerHTML = "";

  const kk = document.createElement("div"); kk.className = "mk"; kk.textContent = k.k;
  const em = document.createElement("div"); em.style.fontSize = "34px"; em.textContent = k.e;
  const my = document.createElement("div"); my.className = "my"; my.textContent = k.ys.join(" ・ ");
  m.appendChild(kk); m.appendChild(em); m.appendChild(my);

  k.w.forEach(pair => {
    const w = document.createElement("div");
    w.className = "mw";
    w.innerHTML = "<b>" + pair[0] + "</b>（" + pair[1] + "）";
    m.appendChild(w);
  });

  const info = document.createElement("div");
  info.className = "mbox";
  info.textContent = isSeen(k.k)
    ? "レベル" + k.lv + " ／ " + k.g + " ／ ⭕" + st.ok + " 🔁" + st.ng + " ／ " + ["","おぼえかけ","もうすこし","おぼえた⭐"][box]
    : "レベル" + k.lv + " ／ " + k.g + " ／ まだ であって いないよ";
  m.appendChild(info);

  const sp = document.createElement("button");
  sp.className = "speak-btn";
  sp.style.marginTop = "12px";
  sp.textContent = "🔊 よみを きく";
  sp.addEventListener("click", () => speak(k.y, true));
  m.appendChild(sp);

  const cl = document.createElement("button");
  cl.className = "big-btn btn-record";
  cl.style.marginTop = "10px";
  cl.textContent = "とじる";
  cl.addEventListener("click", closeModal);
  m.appendChild(cl);

  document.getElementById("modal-back").classList.add("on");
}
function closeModal() { document.getElementById("modal-back").classList.remove("on"); }
document.getElementById("modal-back").addEventListener("click", e => {
  if (e.target.id === "modal-back") closeModal();
});

/* ================================================================
   きろく
================================================================ */
function renderRecord() {
  const body = document.getElementById("record-body");
  const done = KANJI.filter(x => getBox(x.k) === 3).length;
  const met  = KANJI.filter(x => isSeen(x.k)).length;
  body.innerHTML = "";

  const c1 = document.createElement("div");
  c1.className = "card";
  c1.innerHTML =
    '<div class="stat-row">' +
      '<div><div class="n">' + store.data.stars + '</div><div class="l">ほし</div></div>' +
      '<div><div class="n">' + done + '</div><div class="l">おぼえた</div></div>' +
      '<div><div class="n">' + met + '</div><div class="l">であった</div></div>' +
    '</div>';
  body.appendChild(c1);

  const c2 = document.createElement("div");
  c2.className = "card";
  c2.innerHTML = "<h3>あつめた スタンプ（ほし" + STARS_PER_STAMP + "こで 1つ）</h3>";
  const sg = document.createElement("div");
  sg.className = "stamp-grid";
  if (store.data.stamps.length === 0) {
    sg.innerHTML = '<span style="font-size:15px;color:#a0704a">まだ ないよ</span>';
  } else {
    store.data.stamps.forEach(s => { const e = document.createElement("span"); e.textContent = s; sg.appendChild(e); });
  }
  c2.appendChild(sg);
  body.appendChild(c2);

  const keys = Object.keys(store.data.days).sort().slice(-7);
  const c3 = document.createElement("div");
  c3.className = "card";
  c3.innerHTML = "<h3>さいきん 7にち</h3>";
  if (keys.length === 0) {
    c3.innerHTML += '<div style="font-size:15px;color:#a0704a">まだ きろくが ないよ</div>';
  } else {
    const max = Math.max.apply(null, keys.map(k => store.data.days[k].total));
    keys.forEach(k => {
      const d = store.data.days[k];
      const row = document.createElement("div");
      row.className = "bar-row";
      const md = k.slice(5).replace("-", "/");
      row.innerHTML = '<div class="d">' + md + '</div>' +
        '<div class="bar"><i style="width:' + Math.round(d.total / max * 100) + '%"></i></div>' +
        '<div class="v">' + d.ok + "/" + d.total + '</div>';
      c3.appendChild(row);
    });
  }
  body.appendChild(c3);

  const weak = reviewPool();
  const c4 = document.createElement("div");
  c4.className = "card";
  c4.innerHTML = "<h3>にがて かんじ</h3>";
  if (weak.length === 0) {
    c4.innerHTML += '<div style="font-size:15px;color:#a0704a">いまは ないよ 🎉</div>';
  } else {
    const wrap = document.createElement("div");
    wrap.className = "stamp-grid";
    weak.forEach(k => {
      const b = document.createElement("button");
      b.className = "zcell";
      b.style.width = "58px"; b.style.height = "58px"; b.style.aspectRatio = "auto";
      b.textContent = k.k;
      b.addEventListener("click", () => openModal(k));
      wrap.appendChild(b);
    });
    c4.appendChild(wrap);
  }
  body.appendChild(c4);
}

/* ================================================================
   おとなゲート → せってい
================================================================ */
let gateAnswer = 0;
function renderGate() {
  const a = 3 + Math.floor(Math.random() * 7);
  const b = 3 + Math.floor(Math.random() * 7);
  gateAnswer = a + b;
  document.getElementById("gate-q").textContent = a + " + " + b + " = ?";
  document.getElementById("gate-msg").textContent = "";
  const pad = document.getElementById("gate-pad");
  pad.innerHTML = "";
  const nums = new Set([gateAnswer]);
  while (nums.size < 9) {
    const n = 6 + Math.floor(Math.random() * 13);
    nums.add(n);
  }
  shuffle(Array.from(nums)).forEach(n => {
    const btn = document.createElement("button");
    btn.textContent = n;
    btn.addEventListener("click", () => {
      if (n === gateAnswer) showScreen("settings");
      else { document.getElementById("gate-msg").textContent = "ちがうみたい"; renderGate(); }
    });
    pad.appendChild(btn);
  });
}

/* ================================================================
   せってい（おとな用）
================================================================ */
function renderSettings() {
  const s = store.data.settings;
  const body = document.getElementById("settings-body");
  body.innerHTML = "";

  const c1 = document.createElement("div");
  c1.className = "card";
  c1.innerHTML = "<h3>よみあげ</h3>";

  const r1 = document.createElement("div");
  r1.className = "set-row";
  r1.innerHTML = "<span>もんだいを 読み上げる</span>";
  const tg = document.createElement("button");
  tg.className = "chip" + (s.speak ? " on" : "");
  tg.textContent = s.speak ? "ON" : "OFF";
  tg.addEventListener("click", () => { s.speak = !s.speak; store.save(); renderSettings(); });
  r1.appendChild(tg);
  c1.appendChild(r1);

  const r2 = document.createElement("div");
  r2.className = "set-row";
  r2.innerHTML = "<span>はやさ</span>";
  const rate = document.createElement("input");
  rate.type = "range"; rate.min = "0.6"; rate.max = "1.2"; rate.step = "0.05"; rate.value = s.rate;
  rate.addEventListener("change", () => { s.rate = parseFloat(rate.value); store.save(); speak("やま", true); });
  r2.appendChild(rate);
  c1.appendChild(r2);

  const r3 = document.createElement("div");
  r3.className = "set-row";
  r3.innerHTML = "<span>こえ</span>";
  const sel = document.createElement("select");
  sel.id = "voice-select";
  const list = jaVoices();
  if (list.length === 0) {
    const o = document.createElement("option");
    o.textContent = "日本語の音声が見つかりません";
    sel.appendChild(o);
    sel.disabled = true;
  } else {
    list.forEach(v => {
      const o = document.createElement("option");
      o.value = v.voiceURI; o.textContent = v.name;
      if (v.voiceURI === s.voiceURI) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", () => { s.voiceURI = sel.value; store.save(); speak("やま", true); });
  }
  r3.appendChild(sel);
  c1.appendChild(r3);
  body.appendChild(c1);

  const c2 = document.createElement("div");
  c2.className = "card";
  c2.innerHTML = "<h3>データ</h3>" +
    '<div style="font-size:15px;color:#6b5a46;margin-bottom:8px">' +
      "ほし " + store.data.stars + " ／ おぼえた " + KANJI.filter(x => getBox(x.k) === 3).length + "もじ" +
    "</div>";
  const del = document.createElement("button");
  del.className = "big-btn danger";
  del.textContent = "きろくを ぜんぶ けす";
  let armed = false;
  del.addEventListener("click", () => {
    if (!armed) { armed = true; del.textContent = "ほんとうに けす？（もう一度）"; return; }
    localStorage.removeItem("kanji-data");
    store.load();
    renderChips(); renderPoolInfo(); renderSettings();
    del.textContent = "けしました";
  });
  c2.appendChild(del);
  body.appendChild(c2);
}

   起動
================================================================ */
document.getElementById("btn-start").addEventListener("click", () => { sound.tap(); startSession(false); });
document.getElementById("btn-review").addEventListener("click", () => { sound.tap(); startSession(true); });
document.getElementById("btn-again").addEventListener("click", () => { sound.tap(); startSession(session && session.review); });
document.getElementById("btn-quit").addEventListener("click", () => {
  sound.tap();
  endSession();
  showScreen("home");
});

renderChips();
renderPoolInfo();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
